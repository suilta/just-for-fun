<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大六壬起课演示</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 三幕：起课（只见时间与所问）→ 起课动画（十二宫天地盘 + 中央四课三传 + 一行旁白）→ 课成（盘 + 原文 / 过程） */
:root {
  --bg: #ecebe6;
  --surface: #f8f7f3;
  --cell: #fcfbf8;
  --ink: #1d1f24;
  --muted: #64666b;
  --line: #cfccc2;
  --accent: #6b3fa0;      /* 紫：天盘、交互 */
  --gold: #9a6f12;        /* 天将 */
  --cinnabar: #b0362a;    /* 克、强调、印 */
  --jade: #2f7a5c;
  --hl: rgba(107, 63, 160, .13);
  --f-display: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
  --f-body: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --f-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131217; --surface: #1b1a20; --cell: #201f26; --ink: #e7e5ea; --muted: #9d9aa5; --line: #34323c;
    --accent: #b99be0; --gold: #d9b25e; --cinnabar: #e8705f; --jade: #6cc39c; --hl: rgba(185, 155, 224, .16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131217; --surface: #1b1a20; --cell: #201f26; --ink: #e7e5ea; --muted: #9d9aa5; --line: #34323c;
  --accent: #b99be0; --gold: #d9b25e; --cinnabar: #e8705f; --jade: #6cc39c; --hl: rgba(185, 155, 224, .16);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 48px;
}
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
.label { font-size: 12px; letter-spacing: .14em; color: var(--muted); }
input, textarea { font: inherit; color: var(--ink); background: var(--cell); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; width: 100%; }
input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--cell); color: var(--ink); padding: 8px 14px; }
button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; }
button.primary:hover:not(:disabled) { color: var(--surface); filter: brightness(1.08); }
.fade-in { animation: fadein .7s ease both; }
@keyframes fadein { from { opacity: 0; transform: translateY(8px); } }
@keyframes spin { to { transform: rotate(360deg); } }

.top { max-width: 1180px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: space-between; min-height: 36px; }
.brand { font-family: var(--f-display); font-weight: 900; letter-spacing: .3em; font-size: 15px; color: var(--muted); }
#skip { font-size: 13px; padding: 6px 16px; border-radius: 999px; }

/* 第一幕 */
#intro { display: grid; place-items: center; padding-block: 2vh 6vh; }
.altar { position: relative; width: 100%; max-width: 440px; padding-top: 140px; display: grid; gap: 22px; justify-items: center; text-align: center; }
.wheel { position: absolute; left: 50%; top: 210px; width: min(400px, 92vw); aspect-ratio: 1; transform: translate(-50%, -50%); pointer-events: none; opacity: .55; }
.wheel svg { width: 100%; height: 100%; animation: spin 200s linear infinite reverse; }
.wheel text { fill: var(--muted); font-family: var(--f-display); }
.wheel circle { fill: none; stroke: var(--line); }
.altar h1 { position: relative; font-size: clamp(48px, 13vw, 76px); font-weight: 900; letter-spacing: .24em; margin-right: -.24em; line-height: 1.1; padding-top: 30px; }
.altar .sub { position: relative; color: var(--muted); font-size: 14px; letter-spacing: .2em; margin-top: -10px; }
.altar form { position: relative; width: 100%; display: grid; gap: 14px; text-align: left; margin-top: 56px; }
.altar .field { display: grid; gap: 6px; }
#go { white-space: nowrap; justify-self: center; margin-top: 8px; padding: 12px 44px; font-size: 18px; letter-spacing: .5em; font-family: var(--f-display); border-radius: 999px; }
#go span { margin-right: -.5em; }
.settings { position: relative; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.settings summary { cursor: pointer; padding: 10px 12px; font-size: 13px; color: var(--muted); letter-spacing: .08em; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
.settings summary::-webkit-details-marker { display: none; }
.settings summary::after { content: '展开'; color: var(--accent); white-space: nowrap; }
.settings[open] summary::after { content: '收起'; }
.settings summary > span:first-child { white-space: nowrap; }
.settings .sum { color: var(--ink); text-align: right; min-width: 0; }
.opts { display: grid; gap: 12px; padding: 4px 12px 14px; }
.opt { display: grid; gap: 4px; }
.opt select, .opt input[type=number] { font: inherit; color: var(--ink); background: var(--cell); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; width: 100%; }
.opt .note { font-size: 12px; color: var(--muted); margin: 0; }
.opt .inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.opt .inline input[type=number] { width: 7em; }
.altar .hint { position: relative; font-size: 12.5px; color: var(--muted); margin: 0; }

/* 第二、三幕 */
#theater { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 880px) { #theater { grid-template-columns: minmax(0, 1fr); } }
#theater.solo { grid-template-columns: minmax(0, 620px); justify-content: center; }
#theater.solo .side { display: none; }
.boardbox { display: grid; gap: 8px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; font-size: 13px; color: var(--muted); min-height: 21px; }
.meta b { color: var(--ink); font-family: var(--f-display); }
.board { position: relative; width: 100%; max-width: 600px; aspect-ratio: 1; margin: 0 auto; }
.grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 4px; }
.cell { position: relative; background: var(--cell); border: 1px solid var(--line); border-radius: 6px; transition: background .3s, box-shadow .3s, opacity .4s; }
.cell .tag { position: absolute; left: 5px; bottom: 3px; font-size: 10px; color: var(--muted); letter-spacing: .05em; }
.cell.hl { background: var(--hl); box-shadow: inset 0 0 0 2px var(--accent); }
.cell.hot { box-shadow: inset 0 0 0 2px var(--cinnabar); }
.cell.pulse { animation: pulse 1s ease-in-out 2; }
@keyframes pulse { 50% { box-shadow: inset 0 0 0 4px var(--accent); } }
.center { grid-column: 2 / 4; grid-row: 2 / 4; display: grid; align-content: center; justify-items: center; gap: 6px; padding: 4px; text-align: center; min-width: 0; }
.board.dial .cell { opacity: .3; }
.board.dial .center { opacity: 0; }
.board.done .cell { box-shadow: inset 0 0 0 1px var(--gold); }

.ke4 { display: flex; flex-direction: row-reverse; gap: clamp(4px, 1.2vw, 10px); }
.ke { display: grid; justify-items: center; gap: 0; min-width: clamp(30px, 6vw, 44px); padding: 2px 0; border-radius: 4px; transition: opacity .45s ease, transform .45s ease; }
.ke.pend, .chuan div.pend { opacity: 0; transform: translateY(6px); }
.ke .g { font-size: clamp(9px, 1.5vw, 12px); color: var(--gold); min-height: 1.3em; }
.ke .u { font-family: var(--f-display); font-weight: 900; font-size: clamp(18px, 3.4vw, 26px); color: var(--accent); line-height: 1.15; }
.ke .d { font-family: var(--f-display); font-weight: 700; font-size: clamp(15px, 2.8vw, 21px); line-height: 1.15; border-top: 1px solid var(--line); padding-top: 2px; }
.ke .n { font-size: clamp(9px, 1.4vw, 11px); color: var(--muted); }
.ke .x { font-size: clamp(9px, 1.4vw, 11px); color: var(--cinnabar); min-height: 1.3em; font-weight: 700; }
.ke.on { background: var(--hl); }
.method { font-family: var(--f-display); font-weight: 900; color: var(--cinnabar); font-size: clamp(13px, 2.2vw, 16px); min-height: 1.4em; }
.chuan { display: grid; gap: 1px; font-size: clamp(11px, 1.9vw, 14px); }
.chuan div { display: grid; grid-template-columns: 2.2em 1.4em 1.4em 3em 3em; gap: 4px; align-items: baseline; transition: opacity .45s ease, transform .45s ease; }
.method { transition: opacity .45s ease; }
.method.pend { opacity: 0; }
.chuan .p { color: var(--muted); font-size: .85em; }
.chuan .z { font-family: var(--f-display); font-weight: 900; color: var(--accent); font-size: 1.25em; }
.chuan .dg { color: var(--muted); }
.chuan .gn { color: var(--gold); }
.chuan .q { color: var(--ink); }
.chuan .q.k { color: var(--cinnabar); }

.paths { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.paths .arrow { fill: none; stroke: var(--cinnabar); stroke-width: 2; opacity: .7; marker-end: url(#ah); }
.paths #ah path { fill: var(--cinnabar); }
.paths .dialg text { fill: var(--muted); font-family: var(--f-display); font-size: 9px; }
.paths .dialg .ring { fill: none; stroke: var(--line); stroke-width: 1.2; }
.paths .dialg .tick { stroke: var(--muted); stroke-width: 1; }
.paths .dialg .major { stroke: var(--accent); stroke-width: 2; }
.paths .dialg .sun { fill: var(--gold); }
.paths .dialg .sunglow { fill: var(--gold); opacity: .25; }
.paths .dialg .arc { fill: none; stroke: var(--gold); stroke-width: 3; opacity: .7; }
.paths .dialg .now { fill: var(--ink); font-size: 15px; font-weight: 700; }
.paths .dialg .jiang { fill: var(--accent); font-size: 12px; font-weight: 700; }

.chips { position: absolute; inset: 0; pointer-events: none; }
.chip { position: absolute; transform: translate(-50%, -50%) scale(1); white-space: nowrap; line-height: 1.1; will-change: left, top, opacity;
  transition: left var(--mv, .3s) var(--ease, ease-in-out), top var(--mv, .3s) var(--ease, ease-in-out), opacity .35s, transform .35s; }
.chip.off { opacity: 0; transform: translate(-50%, -50%) scale(.6); }
.chip.di { font-family: var(--f-display); font-weight: 700; color: var(--muted); font-size: clamp(13px, 2.3vw, 18px); }
.chip.tian { font-family: var(--f-display); font-weight: 900; color: var(--accent); font-size: clamp(22px, 4.2vw, 34px); }
.chip.tian.key { color: var(--cinnabar); }
.chip.gen { color: var(--gold); font-size: clamp(11px, 1.9vw, 14px); font-weight: 600; }
.chip.dun { color: var(--muted); font-size: clamp(10px, 1.7vw, 13px); }
.chip.badge { font-size: 10px; color: var(--surface); background: var(--cinnabar); padding: 1px 4px; border-radius: 3px; }
.seal { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(1); z-index: 3; pointer-events: none;
  font-family: var(--f-display); font-weight: 900; font-size: clamp(34px, 8vw, 60px); line-height: 1.05; color: var(--cinnabar);
  border: 4px solid var(--cinnabar); border-radius: 10px; padding: 10px 14px; background: var(--cell); writing-mode: vertical-rl; letter-spacing: .1em;
  transition: opacity .5s, transform .5s cubic-bezier(.2, 1.4, .4, 1); }
.seal.off { opacity: 0; transform: translate(-50%, -50%) scale(1.6); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; font-size: 12px; color: var(--muted); }
.legend b { font-weight: 700; }
.caption { min-height: 3.4em; text-align: center; font-family: var(--f-display); font-size: clamp(16px, 2.4vw, 19px); line-height: 1.7; text-wrap: balance; }
.caption .step { display: block; font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.caption > * { animation: fadein .45s ease both; }
.caption b { color: var(--cinnabar); }

.side { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 12px; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }
.pane { display: grid; gap: 12px; min-width: 0; }
.stages { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.stages button { padding: 4px 9px; font-size: 13px; }
.stages button[aria-current="step"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.explain { display: grid; gap: 10px; align-content: start; }
.explain h2 { font-size: 22px; }
.explain h2 .no { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-weight: 400; margin-right: 8px; }
.explain p { margin: 0; max-width: 62ch; }
.explain .rule { font-size: 13px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; }
.explain ul { margin: 0; padding-left: 1.2em; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.small { font-size: 12.5px; color: var(--muted); max-width: 70ch; margin: 0; }
pre#out { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.7; background: var(--cell); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; max-height: 560px; overflow: auto; }
@media (prefers-reduced-motion: reduce) { .chip, .cell, .seal, .caption > *, .ke, .chuan div { transition: none !important; animation: none !important; } .wheel svg, .fade-in { animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <span class="brand" id="brand" hidden>大六壬</span><span></span>
  <button type="button" id="skip" hidden>跳过 ›</button>
</header>

<!-- 第一幕：起课 -->
<section id="intro">
  <div class="altar fade-in">
    <div class="wheel" aria-hidden="true"><svg viewBox="-100 -100 200 200" id="wheel"></svg></div>
    <h1>大六壬</h1>
    <div class="sub">月将加时 · 九宗门</div>
    <form id="form">
      <div class="field">
        <label class="label" for="dt">占时（北京时间）</label>
        <input id="dt" type="datetime-local" required>
      </div>
      <div class="field">
        <label class="label" for="q">所问之事</label>
        <textarea id="q" rows="2" placeholder="心中默念所问，写在这里。例如：这次合作能否谈成"></textarea>
      </div>
      <details class="settings" id="settings">
        <summary><span>起课设置</span><span class="sum" id="optSum"></span></summary>
        <div class="opts">
          <div class="opt">
            <label class="label" for="o-day">换日</label>
            <select id="o-day">
              <option value="23">23 点换日（子初换日，默认）</option>
              <option value="0">0 点换日（子正换日）</option>
            </select>
          </div>
          <div class="opt">
            <label class="label" for="o-dn">昼夜贵人分界</label>
            <select id="o-dn">
              <option value="maoshen">卯至申为昼，酉至寅为夜（默认）</option>
              <option value="sun">按当地日出日落</option>
            </select>
            <div class="inline" id="o-geo"><label class="note" for="o-lat">北纬</label><input type="number" id="o-lat" min="0" max="60" step="0.01" value="39.9"><label class="note" for="o-lon">东经</label><input type="number" id="o-lon" min="70" max="140" step="0.01" value="116.4"></div>
            <p class="note">取传口径固定为：伏吟/返吟 → 贼克 → 比用 → 涉害（《六壬大全》数深浅）→ 八专 → 遥克 → 别责 → 昴星。</p>
          </div>
        </div>
      </details>
      <button type="submit" class="primary" id="go"><span>起课</span></button>
    </form>
    <p class="hint">所问之事会写进课式原文，起完课可以复制给 AI 解读。</p>
  </div>
</section>

<!-- 第二、三幕 -->
<section id="theater" hidden>
  <div class="boardbox">
    <div class="meta" id="meta"></div>
    <div class="board" id="board">
      <div class="grid" id="grid">
        <div class="center" id="center">
          <div class="ke4" id="ke4"></div>
          <div class="method" id="method"></div>
          <div class="chuan" id="chuan"></div>
        </div>
      </div>
      <svg class="paths" id="paths" viewBox="0 0 400 400" preserveAspectRatio="none"></svg>
      <div class="chips" id="chips"></div>
      <div class="seal off" id="seal" aria-hidden="true">课成</div>
    </div>
    <div class="caption" id="caption" aria-live="polite" hidden></div>
    <div class="legend"><span><b style="color:var(--accent)">紫</b> 天盘</span><span><b style="color:var(--muted)">灰</b> 地盘</span><span><b style="color:var(--gold)">金</b> 天将</span><span><b style="color:var(--cinnabar)">红</b> 克 · 空</span></div>
  </div>

  <aside class="side">
    <div class="tabs" id="tabs" role="tablist">
      <button type="button" role="tab" data-tab="raw" aria-selected="true">课式原文</button>
      <button type="button" role="tab" data-tab="process" aria-selected="false">起课过程</button>
    </div>
    <div class="pane" id="pane-raw">
      <div class="row"><button type="button" id="copy">复制文本</button><span class="small">可以粘贴给任何 AI 解读。</span></div>
      <pre id="out"></pre>
      <p class="small" id="foot"></p>
    </div>
    <div class="pane" id="pane-process" hidden>
      <ol class="stages" id="stages"></ol>
      <div class="explain" id="explain"></div>
    </div>
    <div class="row"><button type="button" id="again">重新起课</button></div>
  </aside>
</section>

<script src="qimen.js"></script>
<script src="liuren.js"></script>
<script>
(function () {
  'use strict';
  const LR = window.LR, QM = window.QM;
  const $ = (id) => document.getElementById(id);
  const ZHI = LR.ZHI;
  // 十二宫在 4×4 外圈的位置（上南下北，巳午未申在上）
  const POS = { 5: [0, 0], 6: [1, 0], 7: [2, 0], 8: [3, 0], 9: [3, 1], 10: [3, 2], 11: [3, 3], 0: [2, 3], 1: [1, 3], 2: [0, 3], 3: [0, 2], 4: [0, 1] };
  const SLOT = { gen: [.5, .2], tian: [.5, .52], di: [.8, .82], badge: [.84, .18], dun: [.2, .52] };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const STAGES = ['月将', '地盘', '天盘', '四课', '三传', '天将', '遁干六亲', '课成'];
  const mod = (a, n) => ((a % n) + n) % n;

  let C = null, stage = -1, timers = [], rafs = [], runToken = 0, question = '';
  const chips = {};

  // ── 起课页：十二支轮 ──
  (function drawWheel() {
    let h = '<circle r="94" stroke-width=".4"/><circle r="72" stroke-width=".4"/>';
    LR.JIANG_NAME.forEach((n, i) => {
      const a = (90 + i * 30) * Math.PI / 180;
      h += `<text x="${(Math.cos(a) * 83).toFixed(2)}" y="${(Math.sin(a) * 83 + 4).toFixed(2)}" text-anchor="middle" font-size="11">${ZHI[i]}</text>`;
      h += `<text x="${(Math.cos(a) * 62).toFixed(2)}" y="${(Math.sin(a) * 62 + 2.5).toFixed(2)}" text-anchor="middle" font-size="6">${n}</text>`;
    });
    $('wheel').innerHTML = h;
  })();

  // ── 盘格 ──
  const grid = $('grid');
  for (let z = 0; z < 12; z++) {
    const d = document.createElement('div');
    d.className = 'cell'; d.id = 'cell' + z;
    const [c, r] = POS[z]; d.style.gridColumn = c + 1; d.style.gridRow = r + 1;
    grid.appendChild(d);
  }
  const cellsAll = () => [...grid.querySelectorAll('.cell')];

  function xy(z, slot) { const [c, r] = POS[z]; const [sx, sy] = SLOT[slot]; return [(c + sx) / 4 * 100, (r + sy) / 4 * 100]; }
  function mkChip(key, cls, text) { const el = document.createElement('div'); el.className = 'chip off ' + cls; el.textContent = text; $('chips').appendChild(el); chips[key] = el; return el; }
  function place(el, z, slot, show = true) { const [x, y] = xy(z, slot); el.style.left = x + '%'; el.style.top = y + '%'; el.classList.toggle('off', !show); }
  const later = (ms, fn) => timers.push(setTimeout(fn, reduce ? 20 : ms));
  function clearTimers() { timers.forEach(clearTimeout); timers = []; rafs.forEach(cancelAnimationFrame); rafs = []; }
  function tween(ms, fn, done) {
    if (reduce) { fn(1); done && done(); return; }
    const t0 = performance.now();
    const tick = (now) => { const t = Math.min(1, (now - t0) / ms); fn(t); if (t < 1) rafs.push(requestAnimationFrame(tick)); else if (done) done(); };
    rafs.push(requestAnimationFrame(tick));
  }
  const easeInOut = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  function setMove(ms) { document.documentElement.style.setProperty('--mv', (reduce ? 0 : ms / 1000) + 's'); }
  function setEase(e) { document.documentElement.style.setProperty('--ease', e); }

  function build() {
    $('chips').innerHTML = ''; for (const k in chips) delete chips[k];
    for (let z = 0; z < 12; z++) {
      mkChip('di' + z, 'di', ZHI[z]);
      mkChip('tian' + z, 'tian', ZHI[z]);   // 天盘支 z，起初在本位
      mkChip('gen' + z, 'gen', '');         // 地盘 z 上的天将
      mkChip('dun' + z, 'dun', '');
      mkChip('kong' + z, 'badge', '空');
    }
    for (let z = 0; z < 12; z++) {
      place(chips['di' + z], z, 'di', false); place(chips['tian' + z], z, 'tian', false);
      place(chips['gen' + z], z, 'gen', false); place(chips['dun' + z], z, 'dun', false); place(chips['kong' + z], z, 'badge', false);
      chips['gen' + z].textContent = C.plate[z].general || '';
      chips['dun' + z].textContent = C.plate[z].dun || '';
    }
    buildCenter();
  }

  const S = () => C.steps;
  const seatOf = (tz, rot) => mod(tz + rot, 12); // 天盘支 tz 转动 rot 格后所在地盘
  function setTian(rot, show) { for (let z = 0; z < 12; z++) place(chips['tian' + z], seatOf(z, rot), 'tian', show); }
  function setGens(count, show) {
    const g = S().gen;
    for (let i = 0; i < 12; i++) {
      const pos = mod(g.guiSeat + (g.shun ? i : -i), 12);
      place(chips['gen' + pos], pos, 'gen', show && i < count);
    }
  }
  function clearMarks() {
    $('board').classList.remove('dial', 'done');
    cellsAll().forEach((c) => { c.classList.remove('hl', 'hot', 'pulse'); const t = c.querySelector('.tag'); if (t) t.remove(); });
    Object.values(chips).forEach((c) => c.classList.remove('key'));
    $('paths').innerHTML = '';
  }
  const hl = (z, cls = 'hl') => $('cell' + z).classList.add(cls);
  function tag(z, text) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = text; $('cell' + z).appendChild(t); }

  // ── 中央：四课与三传 ──
  // 四课、三传的元素只建一次；之后只改文字和显隐，已显示的部分不会重新淡入
  function buildCenter() {
    $('ke4').innerHTML = C.ke4.map((k) => `<div class="ke pend" id="ke${k.no}"><span class="g"></span><span class="u">${k.upCh}</span><span class="d">${k.down}</span><span class="x"></span><span class="n">${'一二三四'[k.no - 1]}课</span></div>`).join('');
    $('chuan').innerHTML = C.chuan.map((t, i) => `<div class="pend" id="ch${i}"><span class="p">${t.pos}</span><span class="dg"></span><span class="z">${t.zhi}</span><span class="gn"></span><span class="q"></span></div>`).join('');
    $('method').textContent = S().chuan.method; $('method').classList.add('pend');
  }
  const setText = (el, t) => { if (el.textContent !== t) el.textContent = t; };
  function renderCenter(opt) {
    const { keN = 0, marks = false, chuanN = 0, gens = false, dun = false, method = false } = opt;
    C.ke4.forEach((k, i) => {
      const el = $('ke' + k.no);
      el.classList.toggle('pend', i >= keN);
      setText(el.querySelector('.g'), gens ? k.general : '');
      setText(el.querySelector('.x'), marks ? (k.zei ? '贼' : k.ke ? '克' : '') : '');
    });
    $('method').classList.toggle('pend', !method);
    C.chuan.forEach((t, i) => {
      const el = $('ch' + i);
      el.classList.toggle('pend', i >= chuanN);
      setText(el.querySelector('.dg'), dun ? t.dun : '');
      setText(el.querySelector('.gn'), gens ? t.general : '');
      const q = el.querySelector('.q');
      setText(q, dun ? t.qin + (t.kong ? '空' : '') : '');
      q.classList.toggle('k', !!(t.kong && dun));
    });
  }
  const CENTER = [
    {}, {}, {}, { keN: 4 }, { keN: 4, marks: true, chuanN: 3, method: true },
    { keN: 4, marks: true, chuanN: 3, method: true, gens: true },
    { keN: 4, marks: true, chuanN: 3, method: true, gens: true, dun: true },
    { keN: 4, marks: true, chuanN: 3, method: true, gens: true, dun: true },
  ];

  // ── 黄道盘（月将）：上南下北，左东右西 ──
  const dialPt = (lon, r) => { const a = lon * Math.PI / 180; return [200 - r * Math.cos(a), 200 - r * Math.sin(a)]; };
  const ZQ = ['春分', '谷雨', '小满', '夏至', '大暑', '处暑', '秋分', '霜降', '小雪', '冬至', '大寒', '雨水'];
  function drawDial(lon, from) {
    $('board').classList.add('dial');
    let h = '<g class="dialg"><circle class="ring" cx="200" cy="200" r="150"/>';
    for (let i = 0; i < 24; i++) {
      const L = i * 15, major = i % 2 === 0, [x1, y1] = dialPt(L, major ? 140 : 145), [x2, y2] = dialPt(L, 158);
      h += `<line class="tick ${major ? 'major' : ''}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
    }
    // 十二中气之间的宫位，标出对应的月将
    for (let i = 0; i < 12; i++) {
      const L = i * 30 + 15, [tx, ty] = dialPt(L, 172), [jx, jy] = dialPt(L, 124);
      const zq = ZQ[i]; const jiang = mod(11 - mod(i * 30 - 330, 360) / 30, 12);
      h += `<text x="${tx.toFixed(1)}" y="${(ty + 3).toFixed(1)}" text-anchor="middle">${zq}后</text>`;
      h += `<text class="jiang" x="${jx.toFixed(1)}" y="${(jy + 4).toFixed(1)}" text-anchor="middle">${ZHI[jiang]}</text>`;
    }
    h += '<path class="arc" id="darc" d=""/><circle class="sunglow" id="dglow" r="13"/><circle class="sun" id="dsun" r="7"/>';
    h += `<text class="now" x="200" y="194" text-anchor="middle" id="dnow"></text><text x="200" y="214" text-anchor="middle" id="dlon"></text></g>`;
    $('paths').innerHTML = h;
    setSun(lon, from == null ? lon : from);
  }
  function setSun(lon, from) {
    const [sx, sy] = dialPt(lon, 150);
    for (const id of ['dsun', 'dglow']) { const c = $(id); c.setAttribute('cx', sx.toFixed(2)); c.setAttribute('cy', sy.toFixed(2)); }
    const sweep = mod(lon - from, 360);
    const [ax, ay] = dialPt(from, 150);
    $('darc').setAttribute('d', sweep > 0.2 ? `M${ax.toFixed(2)},${ay.toFixed(2)} A150,150 0 ${sweep > 180 ? 1 : 0} 1 ${sx.toFixed(2)},${sy.toFixed(2)}` : '');
    const k = Math.floor(mod(lon - 330, 360) / 30), j = mod(11 - k, 12);
    $('dnow').textContent = `月将 ${ZHI[j]} · ${LR.JIANG_NAME[j]}`;
    $('dlon').textContent = `太阳黄经 ${mod(lon, 360).toFixed(1)}°`;
  }

  function arrow(fromZ, toZ) {
    const c = (z) => { const [cc, r] = POS[z]; return [cc * 100 + 50, r * 100 + 50]; };
    const [x1, y1] = c(fromZ), [x2, y2] = c(toZ);
    const mx = (x1 + x2) / 2 + (200 - (x1 + x2) / 2) * .35, my = (y1 + y2) / 2 + (200 - (y1 + y2) / 2) * .35;
    return `<path class="arrow" d="M${x1},${y1} Q${mx},${my} ${x2},${y2}"/>`;
  }
  const DEFS = '<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>';
  function chuanArrows(n) {
    const L = S().chuan.list;
    let h = DEFS;
    for (let i = 1; i < n; i++) if (L[i] !== L[i - 1]) h += arrow(L[i - 1], L[i]);
    $('paths').innerHTML = h;
  }
  // 三传中某支在盘上的位置：以天盘支所在宫格表示
  const tianSeat = (tz) => seatOf(tz, S().plate.rot);

  // ── 第 k 幕完成后的静态盘面 ──
  function staticState(k) {
    clearMarks();
    const P = S();
    for (let z = 0; z < 12; z++) place(chips['di' + z], z, 'di', k >= 1);
    setTian(k >= 2 ? P.plate.rot : 0, k >= 2);
    setGens(12, k >= 5);
    for (let z = 0; z < 12; z++) {
      place(chips['dun' + z], z, 'dun', k >= 6 && !!C.plate[z].dun);
      place(chips['kong' + z], z, 'badge', k >= 6 && C.plate[z].kong);
    }
    renderCenter(CENTER[k] || {});
    if (k === 0) drawDial(P.pillars.sunLon);
    if (k === 2) { hl(P.pillars.hourZhi); tag(P.pillars.hourZhi, '占时'); chips['tian' + P.pillars.jiang].classList.add('key'); }
    if (k === 3) { tag(P.ke.jigong, C.dayGan + '寄'); tag(LR.ZHI.indexOf(C.dayZhi), '日支'); }
    if (k === 4) { chuanArrows(3); C.chuan.forEach((t) => hl(tianSeat(t.z))); }
    if (k === 5) { hl(P.gen.guiSeat); }
    if (k === 7) $('board').classList.add('done');
  }

  // ── 各幕动画 ──
  function animate(k, done) {
    const P = S();
    if (k === 0) {
      const lon = P.pillars.sunLon, from = lon - 100;
      drawDial(from, from);
      tween(2200, (t) => setSun(from + (lon - from) * easeInOut(t), from), () => later(1300, done));
      return;
    }
    if (k === 1) {
      for (let i = 0; i < 12; i++) later(110 * i + 200, () => place(chips['di' + i], i, 'di', true));
      later(110 * 12 + 600, done); return;
    }
    if (k === 2) {
      const hz = P.pillars.hourZhi, j = P.pillars.jiang;
      setMove(0); setTian(0, true); void $('chips').offsetWidth;
      later(300, () => { hl(hz); tag(hz, '占时'); $('cell' + hz).classList.add('pulse'); });
      later(900, () => { chips['tian' + j].classList.add('key'); hl(j); });
      const n = P.plate.rot;
      later(1700, () => { $('cell' + j).classList.remove('hl'); setMove(260); setEase('linear'); });
      for (let i = 1; i <= n; i++) later(1700 + 260 * (i - 1) + 20, () => setTian(i, true));
      later(1700 + 260 * n + 600, () => { setEase('ease-in-out'); done(); }); return;
    }
    if (k === 3) {
      const K = C.ke4;
      K.forEach((kk, i) => {
        const t = 300 + 1000 * i;
        later(t, () => {
          cellsAll().forEach((c) => c.classList.remove('hl'));
          hl(kk.downPos);
          if (i === 0) tag(P.ke.jigong, C.dayGan + '寄');
          if (i === 2) tag(LR.ZHI.indexOf(C.dayZhi), '日支');
          Object.values(chips).forEach((c) => c.classList.remove('key'));
          chips['tian' + kk.up].classList.add('key');
        });
        later(t + 500, () => renderCenter({ keN: i + 1 }));
      });
      later(300 + 1000 * 4 + 300, () => { cellsAll().forEach((c) => c.classList.remove('hl')); Object.values(chips).forEach((c) => c.classList.remove('key')); done(); });
      return;
    }
    if (k === 4) {
      renderCenter({ keN: 4 });
      later(300, () => renderCenter({ keN: 4, marks: true }));
      later(1100, () => renderCenter({ keN: 4, marks: true, method: true }));
      C.chuan.forEach((t, i) => later(1900 + 900 * i, () => {
        hl(tianSeat(t.z)); $('cell' + tianSeat(t.z)).classList.add('pulse');
        chuanArrows(i + 1);
        renderCenter({ keN: 4, marks: true, method: true, chuanN: i + 1 });
      }));
      later(1900 + 900 * 3 + 300, done); return;
    }
    if (k === 5) {
      const g = P.gen;
      hl(g.guiSeat); $('cell' + g.guiSeat).classList.add('pulse');
      for (let i = 1; i <= 12; i++) later(250 + 170 * i, () => setGens(i, true));
      later(250 + 170 * 13 + 200, () => renderCenter({ keN: 4, marks: true, method: true, chuanN: 3, gens: true }));
      later(250 + 170 * 13 + 700, done); return;
    }
    if (k === 6) {
      for (let z = 0; z < 12; z++) later(60 * z + 200, () => place(chips['dun' + z], z, 'dun', !!C.plate[z].dun));
      later(1200, () => { for (let z = 0; z < 12; z++) if (C.plate[z].kong) { place(chips['kong' + z], z, 'badge', true); hl(z, 'hot'); } });
      later(1700, () => renderCenter(CENTER[6]));
      later(2400, done); return;
    }
    if (k === 7) { $('board').classList.add('done'); later(300, done); return; }
  }

  // ── 文字 ──
  const zn = (z) => ZHI[z];
  function caption(k) {
    const P = S(); const step = k >= 0 ? `<span class="step">${k + 1} / 8 · ${STAGES[k]}</span>` : '<span class="step">起课</span>';
    const ch = C.chuan.map((t) => t.zhi).join(' ');
    const t = [
      `太阳过${P.pillars.zhongqi}，月将为 <b>${zn(P.pillars.jiang)} · ${P.pillars.jiangName}</b>`,
      '十二地盘，子午卯酉定四正',
      `${zn(P.pillars.jiang)}将加${zn(P.pillars.hourZhi)}时，天盘${P.plate.fuyin ? '不动（伏吟）' : P.plate.fanyin ? '对冲（返吟）' : '随之转动'}`,
      `日干${C.dayGan}寄${zn(P.ke.jigong)}，日支${C.dayZhi}，起出四课`,
      `${P.chuan.method}发用，三传 <b>${ch}</b>`,
      `${P.gen.isDay ? '昼' : '夜'}贵在${zn(P.gen.gui)}，临${zn(P.gen.guiSeat)}${P.gen.shun ? '顺' : '逆'}布十二天将`,
      `${P.extra.xun}旬遁干，旬空 <b>${P.extra.kong.map(zn).join('')}</b>`,
      '课成',
    ];
    $('caption').innerHTML = step + `<span>${k >= 0 ? t[k] : esc(C.input.text) + (question ? '　问：' + esc(question) : '')}</span>`;
  }
  function explain(k) {
    const P = S(); const h = (no, t) => `<h2><span class="no">${no + 1}/8</span>${t}</h2>`;
    let x = '';
    if (k === 0) x = h(0, '四柱与月将') + `<p>四柱 <b>${P.pillars.year} ${P.pillars.month} ${P.pillars.day} ${P.pillars.hour}</b>。太阳视黄经 ${P.pillars.sunLon.toFixed(2)}°，已过${P.pillars.zhongqi}，月将为<b>${zn(P.pillars.jiang)}（${P.pillars.jiangName}）</b>。</p><p class="rule">月将即太阳所在的宫次，以中气换将：雨水后亥、春分后戌……冬至后丑、大寒后子。</p>`;
    if (k === 1) x = h(1, '地盘') + '<p>地盘十二支固定不动：上南下北，巳午未申在上，亥子丑寅在下。</p>';
    if (k === 2) x = h(2, '天盘') + `<p>以月将${zn(P.pillars.jiang)}加在占时${zn(P.pillars.hourZhi)}上，十二支随之顺时针转动 ${P.plate.rot} 格，形成天盘。</p>${P.plate.fuyin ? '<p><b>月将与占时相同，天地盘重合，是伏吟课。</b></p>' : P.plate.fanyin ? '<p><b>天盘与地盘处处对冲，是返吟课。</b></p>' : ''}`;
    if (k === 3) x = h(3, '四课') + `<ul>${C.ke4.map((c) => `<li>第${'一二三四'[c.no - 1]}课：${c.no === 1 ? `日干${c.down}寄${zn(P.ke.jigong)}，` : c.no === 3 ? `日支${c.down}，` : `以上一课上神${c.down}为下，`}其上天盘为 <b>${c.upCh}</b></li>`).join('')}</ul><p class="rule">十干寄宫：甲寅 乙辰 丙戊巳 丁己未 庚申 辛戌 壬亥 癸丑。</p>`;
    if (k === 4) x = h(4, '发三传') + `<p>课体：<b>${P.chuan.method}</b></p><ul>${P.chuan.why.map((w) => `<li>${w}</li>`).join('')}</ul><p>三传：${C.chuan.map((t) => `${t.pos} <b>${t.zhi}</b>`).join('，')}。</p>`;
    if (k === 5) x = h(5, '十二天将') + `<p>${C.dayGan}日${P.gen.isDay ? '昼' : '夜'}占（${C.opts.dayNight === 'sun' ? '按当地日出日落' : '卯至申为昼'}），贵人在${zn(P.gen.gui)}。天盘${zn(P.gen.gui)}临地盘${zn(P.gen.guiSeat)}，${P.gen.shun ? '在亥至辰之间，顺行' : '在巳至戌之间，逆行'}，依次排贵人、腾蛇、朱雀、六合、勾陈、青龙、天空、白虎、太常、玄武、太阴、天后。</p>`;
    if (k === 6) x = h(6, '遁干、六亲、旬空') + `<p>${C.input.text.slice(0, 10)}为${P.pillars.day}日，在${P.extra.xun}旬，按旬遁出各支天干；旬空${P.extra.kong.map(zn).join('、')}。</p><ul>${C.chuan.map((t) => `<li>${t.pos} ${t.dun}${t.zhi}：${t.general}，${t.qin}${t.kong ? '，旬空' : ''}</li>`).join('')}</ul><p class="rule">六亲以日干${C.dayGan}（${C.dayWx}）为我：生我父母，我生子孙，克我官鬼，我克妻财，同我兄弟。</p>`;
    if (k === 7) x = h(7, '课成') + `<p>${P.pillars.day}日${zn(P.pillars.hourZhi)}时，${zn(P.pillars.jiang)}将，${P.chuan.method}课，三传 ${C.chuan.map((t) => t.zhi).join(' ')}。</p>`;
    $('explain').innerHTML = x;
  }
  function showMeta(k) {
    const P = S(); const parts = [];
    if (k >= 0) parts.push(`<span><b>${P.pillars.year} ${P.pillars.month} ${P.pillars.day} ${P.pillars.hour}</b></span>`);
    if (k >= 0) parts.push(`<span>月将 <b>${zn(P.pillars.jiang)}</b>　占时 <b>${zn(P.pillars.hourZhi)}</b></span>`);
    if (k >= 4) parts.push(`<span>${P.chuan.method}</span>`);
    $('meta').innerHTML = parts.join('');
  }

  // ── 阶段与三幕 ──
  STAGES.forEach((name, i) => {
    const li = document.createElement('li'); const b = document.createElement('button');
    b.type = 'button'; b.textContent = `${i + 1} ${name}`; b.addEventListener('click', () => playStage(i));
    li.appendChild(b); $('stages').appendChild(li);
  });
  function markStages() { [...$('stages').querySelectorAll('button')].forEach((b, i) => (i === stage ? b.setAttribute('aria-current', 'step') : b.removeAttribute('aria-current'))); }
  function jump(k) {
    clearTimers(); setMove(0); setEase('ease-in-out');
    stage = k; if (k >= 0) staticState(k); else { clearMarks(); renderCenter({}); for (const c of Object.values(chips)) c.classList.add('off'); }
    if (k >= 0) explain(k); caption(k); showMeta(k); markStages();
    requestAnimationFrame(() => setMove(300));
  }
  function playStage(k) {
    return new Promise((res) => {
      clearTimers(); setMove(0); setEase('ease-in-out');
      if (k > 0) staticState(k - 1); else { clearMarks(); renderCenter({}); for (const c of Object.values(chips)) c.classList.add('off'); }
      stage = k; explain(k); caption(k); showMeta(k); markStages();
      requestAnimationFrame(() => { setMove(300); animate(k, res); });
    });
  }
  const wait = (ms) => new Promise((r) => later(ms, r));
  function setPhase(ph) {
    $('intro').hidden = ph !== 'intro';
    $('theater').hidden = ph === 'intro';
    $('brand').hidden = ph === 'intro';
    $('skip').hidden = ph !== 'ritual';
    $('caption').hidden = ph !== 'ritual';
    $('theater').classList.toggle('solo', ph === 'ritual');
    if (ph !== 'ritual') $('seal').classList.add('off');
    window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
  }
  function showTab(t) {
    for (const b of $('tabs').querySelectorAll('button')) b.setAttribute('aria-selected', String(b.dataset.tab === t));
    $('pane-raw').hidden = t !== 'raw'; $('pane-process').hidden = t !== 'process';
  }
  $('tabs').addEventListener('click', (e) => { const t = e.target.closest('button')?.dataset.tab; if (!t) return; showTab(t); jump(7); });

  async function ritual() {
    const my = ++runToken;
    setPhase('ritual');
    $('theater').classList.remove('fade-in'); void $('theater').offsetWidth; $('theater').classList.add('fade-in');
    jump(-1);
    await wait(500); if (my !== runToken) return;
    for (let k = 0; k < STAGES.length; k++) { await playStage(k); if (my !== runToken) return; }
    $('seal').classList.remove('off');
    await wait(1800); if (my !== runToken) return;
    finish();
  }
  function finish() { runToken++; clearTimers(); jump(7); setPhase('result'); showTab('raw'); }
  $('skip').addEventListener('click', finish);
  $('again').addEventListener('click', () => { runToken++; clearTimers(); setPhase('intro'); $('dt').value = beijingNow(); });

  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  $('copy').addEventListener('click', () => {
    const t = $('out').textContent;
    const ok = () => { $('copy').textContent = '已复制'; setTimeout(() => ($('copy').textContent = '复制文本'), 1600); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($('out')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $('copy').textContent = '已选中，按 Ctrl+C 复制'; };
    try { navigator.clipboard.writeText(t).then(ok, fallback); } catch (e) { fallback(); }
  });

  const pad = (n) => String(n).padStart(2, '0');
  function beijingNow() { const d = new Date(Date.now() + 8 * 3600e3); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}T${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; }
  // ── 起课设置（记在本机浏览器里）──
  const OPT_KEY = 'liuren-opts-v1';
  function readOpts() {
    const lat = parseFloat($('o-lat').value), lon = parseFloat($('o-lon').value);
    return { dayChange: +$('o-day').value, dayNight: $('o-dn').value, lat: isFinite(lat) ? lat : 39.9, lon: isFinite(lon) ? lon : 116.4 };
  }
  const optSummary = (o) => `${LR.OPT_TEXT.dayChange[o.dayChange]} · ${o.dayNight === 'sun' ? `日出日落（${o.lat}°N ${o.lon}°E）` : '卯申分昼夜'}`;
  function syncOpts() {
    const o = readOpts();
    $('optSum').textContent = optSummary(o);
    $('o-geo').hidden = o.dayNight !== 'sun';
    try { localStorage.setItem(OPT_KEY, JSON.stringify(o)); } catch (e) { /* 无痕模式等 */ }
  }
  (function loadOpts() {
    let o = null;
    try { o = JSON.parse(localStorage.getItem(OPT_KEY) || 'null'); } catch (e) { o = null; }
    o = Object.assign({}, LR.DEFAULT_OPTS, o || {});
    $('o-day').value = String(o.dayChange); $('o-dn').value = o.dayNight; $('o-lat').value = o.lat; $('o-lon').value = o.lon;
    syncOpts();
  })();
  for (const id of ['o-day', 'o-dn', 'o-lat', 'o-lon']) $(id).addEventListener('change', syncOpts);

  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = $('dt').value; if (!v) return;
    const [ds, ts] = v.split('T'); const [y, m, d] = ds.split('-').map(Number); const [hh, mm] = ts.split(':').map(Number);
    question = $('q').value.trim();
    C = LR.cast(y, m, d, hh, mm, readOpts());
    $('foot').textContent = `本课设置：${optSummary(C.opts)}。月将在中气交接的精确时刻换将，节气用截断 VSOP87 自行计算，误差在 1 分钟以内。取传口径：伏吟/返吟 → 贼克 → 比用 → 涉害（《六壬大全》数深浅：起点与本家不计，等深取临孟、临仲，再平阳日干上、阴日支上）→ 八专 → 遥克 → 别责 → 昴星。`;
    build();
    $('out').textContent = LR.toText(C, question);
    ritual();
  });
  $('dt').value = beijingNow();
})();
</script>
</body>
</html>
