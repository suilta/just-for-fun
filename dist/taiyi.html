<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>太乙神数起式演示</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 三幕：起式（只见时间与所问）→ 起式动画（外圈十六神 + 内圈太乙九宫 + 一行旁白）→ 式成（盘 + 原文 / 过程） */
:root {
  --bg: #e8ece8;
  --surface: #f7f9f6;
  --cell: #fcfdfb;
  --ink: #1b221d;
  --muted: #5f6b63;
  --line: #c6d0c8;
  --accent: #2f6b4f;      /* 青绿：太乙、交互 */
  --gold: #9a6f12;        /* 文昌、计神 */
  --cinnabar: #b0362a;    /* 始击、格局、印 */
  --indigo: #3a4f8c;      /* 主将 */
  --plum: #8a3f72;        /* 客将 */
  --hl: rgba(47, 107, 79, .13);
  --f-display: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
  --f-body: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --f-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101512; --surface: #171e1a; --cell: #1c241f; --ink: #e2e9e4; --muted: #95a39a; --line: #2e3a33;
    --accent: #7cc4a0; --gold: #d9b25e; --cinnabar: #e8705f; --indigo: #93a8e6; --plum: #d590c0; --hl: rgba(124, 196, 160, .15);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101512; --surface: #171e1a; --cell: #1c241f; --ink: #e2e9e4; --muted: #95a39a; --line: #2e3a33;
  --accent: #7cc4a0; --gold: #d9b25e; --cinnabar: #e8705f; --indigo: #93a8e6; --plum: #d590c0; --hl: rgba(124, 196, 160, .15);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 48px;
}
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
.label { font-size: 12px; letter-spacing: .14em; color: var(--muted); }
input, textarea { font: inherit; color: var(--ink); background: var(--cell); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; width: 100%; }
input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--cell); color: var(--ink); padding: 8px 14px; }
button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; }
button.primary:hover:not(:disabled) { color: var(--surface); filter: brightness(1.08); }
.fade-in { animation: fadein .7s ease both; }
@keyframes fadein { from { opacity: 0; transform: translateY(8px); } }
@keyframes spin { to { transform: rotate(360deg); } }

.top { max-width: 1180px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: space-between; min-height: 36px; }
.brand { font-family: var(--f-display); font-weight: 900; letter-spacing: .3em; font-size: 15px; color: var(--muted); }
#skip { font-size: 13px; padding: 6px 16px; border-radius: 999px; }

/* 第一幕 */
#intro { display: grid; place-items: center; padding-block: 2vh 6vh; }
.altar { position: relative; width: 100%; max-width: 440px; padding-top: 140px; display: grid; gap: 22px; justify-items: center; text-align: center; }
.wheel { position: absolute; left: 50%; top: 210px; width: min(400px, 92vw); aspect-ratio: 1; transform: translate(-50%, -50%); pointer-events: none; opacity: .55; }
.wheel svg { width: 100%; height: 100%; animation: spin 240s linear infinite; }
.wheel text { fill: var(--muted); font-family: var(--f-display); }
.wheel circle, .wheel rect { fill: none; stroke: var(--line); }
.altar h1 { position: relative; font-size: clamp(44px, 12vw, 70px); font-weight: 900; letter-spacing: .2em; margin-right: -.2em; line-height: 1.1; padding-top: 30px; }
.altar .sub { position: relative; color: var(--muted); font-size: 14px; letter-spacing: .2em; margin-top: -10px; }
.altar form { position: relative; width: 100%; display: grid; gap: 14px; text-align: left; margin-top: 80px; }
.altar .field { display: grid; gap: 6px; }
#go { white-space: nowrap; justify-self: center; margin-top: 8px; padding: 12px 44px; font-size: 18px; letter-spacing: .5em; font-family: var(--f-display); border-radius: 999px; }
#go span { margin-right: -.5em; }
.settings { position: relative; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.settings summary { cursor: pointer; padding: 10px 12px; font-size: 13px; color: var(--muted); letter-spacing: .08em; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
.settings summary::-webkit-details-marker { display: none; }
.settings summary::after { content: '展开'; color: var(--accent); white-space: nowrap; }
.settings[open] summary::after { content: '收起'; }
.settings summary > span:first-child { white-space: nowrap; }
.settings .sum { color: var(--ink); text-align: right; min-width: 0; }
.opts { display: grid; gap: 12px; padding: 4px 12px 14px; }
.opt { display: grid; gap: 4px; }
.opt input[type=number] { font: inherit; color: var(--ink); background: var(--cell); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; width: 7em; }
.opt .note { font-size: 12px; color: var(--muted); margin: 0; }
.opt .inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.opt label.chk { display: flex; gap: 6px; align-items: center; font-size: 14px; }
.opt label.chk input { width: auto; margin: 0; }
.opt .what { font-size: 12.5px; color: var(--ink); margin: 0; line-height: 1.65; }
.opt .impact { font-size: 12.5px; margin: 0; padding: 6px 9px; border-radius: 6px; background: var(--cell); border: 1px dashed var(--line); line-height: 1.6; }
.opt .impact b { font-weight: 700; }
.opt .impact.same b { color: var(--accent); }
.opt .impact.diff b { color: var(--cinnabar); }
.altar .hint { position: relative; font-size: 12.5px; color: var(--muted); margin: 0; }

/* 第二、三幕 */
#theater { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 880px) { #theater { grid-template-columns: minmax(0, 1fr); } }
#theater.solo { grid-template-columns: minmax(0, 620px); justify-content: center; }
#theater.solo .side { display: none; }
.boardbox { display: grid; gap: 8px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; font-size: 13px; color: var(--muted); min-height: 21px; }
.meta b { color: var(--ink); font-family: var(--f-display); }
.board { position: relative; width: 100%; max-width: 600px; aspect-ratio: 1; margin: 0 auto; }
.grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); gap: 3px; }
.cell { position: relative; background: var(--cell); border: 1px solid var(--line); border-radius: 5px; transition: background .3s, box-shadow .3s, opacity .4s; overflow: hidden; }
.cell.inner { background: var(--surface); }
.cell .nm { position: absolute; left: 0; right: 0; top: 4%; text-align: center; font-size: clamp(8px, 1.5vw, 11px); color: var(--muted); white-space: nowrap; }
.cell .ch { position: absolute; left: 0; right: 0; top: 18%; text-align: center; font-family: var(--f-display); font-weight: 900; font-size: clamp(16px, 3.4vw, 26px); color: var(--ink); line-height: 1.1; }
.cell.inner .ch { top: 8%; font-size: clamp(15px, 3vw, 22px); color: var(--muted); }
.cell.inner .nm { top: auto; bottom: 3%; }
.cell.dim { opacity: .15; }
.cell.hl { background: var(--hl); box-shadow: inset 0 0 0 2px var(--accent); }
.cell.hot { box-shadow: inset 0 0 0 2px var(--cinnabar); }
.cell.pulse { animation: pulse 1s ease-in-out 2; }
@keyframes pulse { 50% { box-shadow: inset 0 0 0 4px var(--accent); } }
.board.done .cell { box-shadow: inset 0 0 0 1px var(--gold); }
.board.done .cell.hot { box-shadow: inset 0 0 0 2px var(--cinnabar); }

.chips { position: absolute; inset: 0; pointer-events: none; }
.chip { position: absolute; transform: translate(-50%, -50%) scale(1); white-space: nowrap; line-height: 1; will-change: left, top, opacity;
  font-size: clamp(9px, 1.7vw, 12px); font-weight: 700; padding: 2px 4px; border-radius: 3px; color: var(--surface);
  transition: left var(--mv, .3s) var(--ease, ease-in-out), top var(--mv, .3s) var(--ease, ease-in-out), opacity .35s, transform .35s; }
.chip.off { opacity: 0; transform: translate(-50%, -50%) scale(.5); }
.chip { left: 50%; top: 50%; }
.chip.ty { background: var(--accent); font-family: var(--f-display); font-size: clamp(12px, 2.4vw, 17px); padding: 3px 6px; }
.chip.wc { background: var(--gold); }
.chip.js { background: none; color: var(--gold); border: 1px solid var(--gold); }
.chip.he { background: none; color: var(--muted); border: 1px solid var(--line); }
.chip.sf { background: var(--cinnabar); }
.chip.hg, .chip.hv { background: var(--indigo); }
.chip.ag, .chip.av { background: var(--plum); }

.counter { position: absolute; left: 20%; top: 20%; width: 60%; height: 60%; display: grid; place-content: center; gap: 6px; text-align: center; z-index: 2; pointer-events: none; transition: opacity .4s; }
.counter.off { opacity: 0; }
.counter .k { font-size: clamp(11px, 1.9vw, 14px); color: var(--muted); letter-spacing: .2em; }
.counter .n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: clamp(16px, 3.8vw, 30px); color: var(--ink); }
.counter .op { font-family: var(--f-mono); font-size: clamp(11px, 2vw, 15px); color: var(--muted); min-height: 1.5em; }
.counter .res { font-family: var(--f-display); font-weight: 900; font-size: clamp(20px, 4.4vw, 34px); color: var(--accent); min-height: 1.3em; }
.cell .cal { position: absolute; left: 0; right: 0; top: 30%; display: grid; gap: 2px; justify-items: center; font-size: clamp(9px, 1.6vw, 12px); color: var(--muted); transition: opacity .4s; }
.cell .cal b { font-family: var(--f-display); font-weight: 900; font-size: clamp(14px, 2.8vw, 20px); margin-left: 3px; }
.cell .cal .h b { color: var(--indigo); } .cell .cal .a b { color: var(--plum); }
.cell .cal.off { opacity: 0; }

.seal { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(1); z-index: 3; pointer-events: none;
  font-family: var(--f-display); font-weight: 900; font-size: clamp(34px, 8vw, 60px); line-height: 1.05; color: var(--cinnabar);
  border: 4px solid var(--cinnabar); border-radius: 10px; padding: 10px 14px; background: var(--cell); writing-mode: vertical-rl; letter-spacing: .1em;
  transition: opacity .5s, transform .5s cubic-bezier(.2, 1.4, .4, 1); }
.seal.off { opacity: 0; transform: translate(-50%, -50%) scale(1.6); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: center; font-size: 12px; color: var(--muted); }
.legend i { font-style: normal; font-weight: 700; padding: 0 4px; border-radius: 3px; color: var(--surface); }
.caption { min-height: 3.4em; text-align: center; font-family: var(--f-display); font-size: clamp(16px, 2.4vw, 19px); line-height: 1.7; text-wrap: balance; }
.caption .step { display: block; font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.caption > * { animation: fadein .45s ease both; }
.caption b { color: var(--cinnabar); }

.side { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 12px; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }
.pane { display: grid; gap: 12px; min-width: 0; }
.stages { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.stages button { padding: 4px 9px; font-size: 13px; }
.stages button[aria-current="step"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.explain { display: grid; gap: 10px; align-content: start; }
.explain h2 { font-size: 22px; }
.explain h2 .no { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-weight: 400; margin-right: 8px; }
.explain p { margin: 0; max-width: 62ch; }
.explain .rule { font-size: 13px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; }
.explain ul { margin: 0; padding-left: 1.2em; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.small { font-size: 12.5px; color: var(--muted); max-width: 70ch; margin: 0; }
pre#out { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.7; background: var(--cell); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; max-height: 560px; overflow: auto; }
@media (prefers-reduced-motion: reduce) { .chip, .cell, .seal, .counter, .calbox, .caption > * { transition: none !important; animation: none !important; } .wheel svg, .fade-in { animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <span class="brand" id="brand" hidden>太乙神数</span><span></span>
  <button type="button" id="skip" hidden>跳过 ›</button>
</header>

<!-- 第一幕：起式 -->
<section id="intro">
  <div class="altar fade-in">
    <div class="wheel" aria-hidden="true"><svg viewBox="-100 -100 200 200" id="wheel"></svg></div>
    <h1>太乙神数</h1>
    <div class="sub" id="sub">太乙统宗宝鉴 · 时计</div>
    <form id="form">
      <div class="field">
        <label class="label" for="dt">起式时间（北京时间）</label>
        <input id="dt" type="datetime-local" required>
      </div>
      <div class="field">
        <label class="label" for="q">所问之事</label>
        <textarea id="q" rows="2" placeholder="心中默念所问，写在这里。例如：这次竞争谁占上风"></textarea>
      </div>
      <details class="settings" id="settings">
        <summary><span>起式设置</span><span class="sum" id="optSum"></span></summary>
        <div class="opts">
          <div class="opt">
            <label class="label" for="o-ji">计式</label>
            <select id="o-ji" data-fancy>
              <option value="shi" data-desc="按起式那个时辰排盘，每个时辰换一局，太乙三个时辰移一宫。冬至后阳遁、夏至后阴遁。看眼前一件事用它。">时计（默认）</option>
              <option value="sui" data-desc="按年份排盘，一年一局，太乙三年移一宫，始终阳遁。看一整年的大势，年份按立春换年。">岁计</option>
            </select>
            <p class="impact" id="i-ji" hidden></p>
          </div>
          <div class="opt">
            <label class="label" for="o-day">换日</label>
            <select id="o-day" data-fancy>
              <option value="23" data-desc="晚上 23 点（子时开始）就算第二天，日柱换成次日。">23 点换日（默认）</option>
              <option value="0" data-desc="到半夜 0 点才换日，23 点到 0 点之间日柱仍算当天。">0 点换日</option>
            </select>
            <p class="what">太乙的积时按时辰连续计数，不受换日影响；这一项只改变显示的日柱。</p>
          </div>
          <div class="opt">
            <span class="label">真太阳时</span>
            <label class="chk" for="o-solar"><input type="checkbox" id="o-solar"> 用真太阳时定时辰</label>
            <p class="what">钟表上的北京时间是按东经 120° 定的。真太阳时按当地经度校正，西部地区常差一小时左右，可能换一个时辰，时计就会换一局。冬至、夏至的阴阳遁切换始终按真实时刻。</p>
            <div class="inline"><label class="note" for="o-lon">起式地东经</label><input type="number" id="o-lon" min="70" max="140" step="0.01" value="120"><span class="note">度，例如北京 116.40、成都 104.07</span></div>
            <p class="impact" id="i-solar" hidden></p>
          </div>
          <p class="note">主派《太乙统宗宝鉴》。定算、四神、天乙、地乙、直符、飞符、四郭固杜、月计、日计各家未统一，暂不排。</p>
        </div>
      </details>
      <button type="submit" class="primary" id="go"><span>起式</span></button>
    </form>
    <p class="hint">所问之事会写进式盘原文，起完式可以复制给 AI 解读。</p>
  </div>
</section>

<!-- 第二、三幕 -->
<section id="theater" hidden>
  <div class="boardbox">
    <div class="meta" id="meta"></div>
    <div class="board" id="board">
      <div class="grid" id="grid"></div>
      <div class="chips" id="chips"></div>
      <div class="counter off" id="counter"><span class="k" id="cK"></span><span class="n" id="cN"></span><span class="op" id="cOp"></span><span class="res" id="cRes"></span></div>
      <div class="seal off" id="seal" aria-hidden="true">式成</div>
    </div>
    <div class="caption" id="caption" aria-live="polite" hidden></div>
    <div class="legend"><span><i style="background:var(--accent)">太乙</i></span><span><i style="background:var(--gold)">文昌</i></span><span><i style="background:var(--cinnabar)">始击</i></span><span><i style="background:var(--indigo)">主将</i></span><span><i style="background:var(--plum)">客将</i></span></div>
  </div>

  <aside class="side">
    <div class="tabs" id="tabs" role="tablist">
      <button type="button" role="tab" data-tab="raw" aria-selected="true">式盘原文</button>
      <button type="button" role="tab" data-tab="process" aria-selected="false">起式过程</button>
    </div>
    <div class="pane" id="pane-raw">
      <div class="row"><button type="button" id="copy">复制文本</button><span class="small">可以粘贴给任何 AI 解读。</span></div>
      <pre id="out"></pre>
      <p class="small" id="foot"></p>
    </div>
    <div class="pane" id="pane-process" hidden>
      <ol class="stages" id="stages"></ol>
      <div class="explain" id="explain"></div>
    </div>
    <div class="row"><button type="button" id="again">重新起式</button></div>
  </aside>
</section>

<script>
/*
 * 奇门遁甲 · 时家转盘 · 拆补法 —— 纯算法核心（无依赖）
 * 浏览器中挂到 window.QM；Node 中 module.exports。
 *
 * 包含：
 *   - 太阳视黄经（截断 VSOP87 + 章动 + 光行差，精度约数角秒 ≈ 1 分钟内）
 *   - 节气时刻求解、四柱干支（立春换年、节换月、23 点换日）
 *   - 起局：阴阳遁、三元（拆补法）、局数
 *   - 地盘、旬首、值符值使、天盘九星、人盘八门、神盘八神、空亡、驿马、格局
 * 每一步都把中间过程写进 steps，供页面做分阶段动画。
 */
(function (root, factory) {
  const QM = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = QM;
  else root.QM = QM;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ───────────────────────── 基础表 ─────────────────────────
  const GAN = '甲乙丙丁戊己庚辛壬癸'.split('');
  const ZHI = '子丑寅卯辰巳午未申酉戌亥'.split('');
  const ganzhi = (i) => GAN[((i % 10) + 10) % 10] + ZHI[((i % 12) + 12) % 12];
  const mod = (a, n) => ((a % n) + n) % n;

  // 24 节气，以视黄经 0°（春分）为起点，每 15° 一个
  const JIEQI = ['春分', '清明', '谷雨', '立夏', '小满', '芒种', '夏至', '小暑', '大暑', '立秋', '处暑', '白露',
    '秋分', '寒露', '霜降', '立冬', '小雪', '大雪', '冬至', '小寒', '大寒', '立春', '雨水', '惊蛰'];

  // 局数表：节气 → [阴/阳, 上元, 中元, 下元]
  const JU_TABLE = {

  // 日地距离 R0..R1（光行差只需粗略值）
  const VR = [
    [[100013989, 0, 0], [1670700, 3.0984635, 6283.07585], [13956, 3.05525, 12566.1517], [3084, 5.1985, 77713.7715],
      [1628, 1.1739, 5753.3849], [1576, 2.8469, 7860.4194], [925, 5.453, 11506.77], [542, 4.564, 3930.21]],

  ];
  const sumSeries = (S, t) => {
    let r = 0, tp = 1;
    for (const terms of S) {
      let s = 0;
      for (const [a, b, c] of terms) s += a * Math.cos(b + c * t);
      r += s * tp; tp *= t;
    }
    return r / 1e8;
  };

  // ΔT（秒），Espenak & Meeus 多项式
  function deltaT(y) {
    if (y < 1900) { const t = (y - 1820) / 100; return -20 + 32 * t * t; }
    if (y < 1920) { const t = y - 1900; return -2.79 + 1.494119 * t - 0.0598939 * t * t + 0.0061966 * t ** 3 - 0.000197 * t ** 4; }
    if (y < 1941) { const t = y - 1920; return 21.2 + 0.84493 * t - 0.0761 * t * t + 0.0020936 * t ** 3; }
    if (y < 1961) { const t = y - 1950; return 29.07 + 0.407 * t - t * t / 233 + t ** 3 / 2547; }
    if (y < 1986) { const t = y - 1975; return 45.45 + 1.067 * t - t * t / 260 - t ** 3 / 718; }
    if (y < 2005) { const t = y - 2000; return 63.86 + 0.3345 * t - 0.060374 * t * t + 0.0017275 * t ** 3 + 0.000651814 * t ** 4 + 0.00002373599 * t ** 5; }
    if (y < 2050) { const t = y - 2000; return 62.92 + 0.32217 * t + 0.005589 * t * t; }
    if (y < 2150) return -20 + 32 * ((y - 1820) / 100) ** 2 - 0.5628 * (2150 - y);
    const u = (y - 1820) / 100; return -20 + 32 * u * u;
  }

  // 太阳视黄经（度），参数为力学时儒略日 JDE
  function sunApparentLon(jde) {
    const t = (jde - 2451545) / 365250;
    const L = sumSeries(VL, t);
    const R = sumSeries(VR, t);
    let lon = L * 180 / Math.PI + 180; // 地心
    const T = t * 10;
    lon += -0.09033 / 3600; // FK5
    const om = (125.04452 - 1934.136261 * T) * Math.PI / 180;
    const Ls = (280.4665 + 36000.7698 * T) * Math.PI / 180;
    const Lm = (218.3165 + 481267.8813 * T) * Math.PI / 180;
    const dpsi = -17.2 * Math.sin(om) - 1.32 * Math.sin(2 * Ls) - 0.23 * Math.sin(2 * Lm) + 0.21 * Math.sin(2 * om);
    lon += dpsi / 3600;
    lon += -20.4898 / 3600 / R; // 光行差
    return mod(lon, 360);
  }

  // 公历（北京时间）↔ 儒略日（UT）
  function jdFromBeijing(y, m, d, h = 0, mi = 0, s = 0) {
    const ms = Date.UTC(y, m - 1, d, h, mi, s) - 8 * 3600e3;
    return ms / 86400e3 + 2440587.5;
  }
  function beijingFromJd(jd) {
    const dt = new Date(Math.round((jd - 2440587.5) * 86400e3 + 8 * 3600e3));
    return { y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate(), h: dt.getUTCHours(), mi: dt.getUTCMinutes(), s: dt.getUTCSeconds() };
  }
  const jdeOf = (jd) => { const y = beijingFromJd(jd).y; return jd + deltaT(y) / 86400; };
  const sunLonAtJd = (jd) => sunApparentLon(jdeOf(jd));

  // 求太阳到达 target 度的时刻（UT 儒略日），从 guess 附近迭代
  function solveTerm(target, guess) {
    let jd = guess;
    for (let i = 0; i < 20; i++) {
      const diff = mod(target - sunLonAtJd(jd) + 180, 360) - 180;
      jd += diff / 360 * 365.2422;
      if (Math.abs(diff) < 1e-7) break;
    }
    return jd;
  }

  const pad = (n) => String(n).padStart(2, '0');
  const fmtDT = (o) => `${o.y}-${pad(o.m)}-${pad(o.d)} ${pad(o.h)}:${pad(o.mi)}`;

  // ───────────────────────── 排盘选项 ─────────────────────────
  const DEFAULT_OPTS = {
    yuan: 'chaibu',   // 定局：chaibu 拆补法 / zhirun 置闰法 / maoshan 茅山法
    ji: 'kun',        // 中五寄宫：kun 恒寄坤二 / genkun 阳遁寄艮八、阴遁寄坤二
    gods: 'huxuan',   // 八神：huxuan 白虎玄武 / gouque 勾陈朱雀
    dayChange: 23,    // 换日：23 子初换日 / 0 子正换日
    solar: false,     // 是否用真太阳时定日柱、时柱
    lon: 120,         // 出生地或起局地经度（东经，度）
  };
  const OPT_TEXT = {
    yuan: { chaibu: '拆补法', zhirun: '置闰法', maoshan: '茅山法' },
    ji: { kun: '中五寄坤二', genkun: '中五阳遁寄艮八、阴遁寄坤二' },
    gods: { huxuan: '八神用白虎玄武', gouque: '八神用勾陈朱雀' },
    dayChange: { 23: '23 点换日', 0: '0 点换日' },
  };
  const withDefaults = (o) => Object.assign({}, DEFAULT_OPTS, o || {});

  // 均时差（分钟），NOAA 近似式，误差约半分钟
  function equationOfTime(y, m, d, h) {
    const doy = (Date.UTC(y, m - 1, d) - Date.UTC(y, 0, 1)) / 864e5 + 1;
    const g = 2 * Math.PI / 365 * (doy - 1 + (h - 12) / 24);
    return 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  }
  const civilJdn = (y, m, d) => Math.floor(Date.UTC(y, m - 1, d) / 86400e3 + 2440587.5 + 0.5);

  // ───────────────────────── 四柱 ─────────────────────────
  // 年、月柱按真实时刻（节气）定；日、时柱按“钟点”定，钟点可选真太阳时
  function fourPillars(y, m, d, h, mi, opts) {
    const o = withDefaults(opts);
    const jd = jdFromBeijing(y, m, d, h, mi);
    const lon = sunLonAtJd(jd);

    // 年柱：立春（315°）换年
    let yy = y;
    if (m <= 2 && lon >= 240 && lon < 315) yy = y - 1;
    const yearIdx = mod(yy - 4, 60);

    // 月柱：节换月；寅月从 315° 起，每 30° 一月
    const mOrder = Math.floor(mod(lon - 315, 360) / 30); // 0 = 寅月
    const monthGan = mod((yearIdx % 10 % 5) * 2 + 2 + mOrder, 10);
    const monthZhi = mod(2 + mOrder, 12);
    const monthIdx = sixtyIndex(monthGan, monthZhi);

    // 钟点：北京时间，或经度与均时差修正后的真太阳时
    let offsetMin = 0, eot = 0;
    if (o.solar) { eot = equationOfTime(y, m, d, h); offsetMin = (o.lon - 120) * 4 + eot; }
    const ck = new Date(Date.UTC(y, m - 1, d, h, mi) + Math.round(offsetMin * 60e3));
    const clock = { y: ck.getUTCFullYear(), m: ck.getUTCMonth() + 1, d: ck.getUTCDate(), h: ck.getUTCHours(), mi: ck.getUTCMinutes() };

    // 日柱：子初（23 点）或子正（0 点）换日
    const dayShift = o.dayChange === 23 && clock.h >= 23 ? 1 : 0;
    const dayNum = civilJdn(clock.y, clock.m, clock.d) + dayShift;
    const dayIdx = mod(dayNum + 49, 60);

    // 时柱：五鼠遁
    const hourZhi = Math.floor((clock.h + 1) / 2) % 12;
    const hourGan = mod((dayIdx % 10 % 5) * 2 + hourZhi, 10);
    const hourIdx = sixtyIndex(hourGan, hourZhi);

    return { jd, lon, yearIdx, monthIdx, dayIdx, hourIdx, dayShift, dayNum, clock, offsetMin, eot };
  }

  // ───────────────────────── 置闰法 ─────────────────────────
  // 每 15 天一个符头（甲子、己卯、甲午、己酉日）开一个节气的上元。
  // 符头早于节气为超神，晚于节气为接气；芒种、大雪之后超神超过 9 天，则重复该节气三元（置闰）。
  const SHANGYUAN_HEAD = [0, 15, 30, 45];
  function termDayNum(idx, guessJd, o) {
    const jd = solveTerm(idx * 15, guessJd);
    const t = beijingFromJd(jd);
    return { jd, day: civilJdn(t.y, t.m, t.d) + (o.dayChange === 23 && t.h >= 23 ? 1 : 0) };
  }
  function zhirun(dayNum, o) {
    // 从约三年前的冬至起，逐个符头往后推
    const approxYear = new Date((dayNum - 2440587.5) * 864e5).getUTCFullYear();
    let tIdx = 18; // 冬至
    let term = termDayNum(18, jdFromBeijing(approxYear - 3, 12, 21), o);
    let S = term.day;
    for (let k = -7; k <= 7; k++) if (SHANGYUAN_HEAD.includes(mod(term.day + k + 49, 60))) { S = term.day + k; break; } // 15 天内恰有一个上元符头
    let leap = false;
    let guard = 0;
    while (S + 15 <= dayNum && guard++ < 400) {
      const nIdx = (tIdx + 1) % 24;
      const next = termDayNum(nIdx, term.jd + 15.2, o);
      const overshoot = next.day - (S + 15); // 下一个符头相对下一个节气提前的天数（超神）
      if ((JIEQI[tIdx] === '芒种' || JIEQI[tIdx] === '大雪') && overshoot > 9 && !leap) {
        leap = true; // 重复本节气三元
      } else {
        tIdx = nIdx; term = next; leap = false;
      }
      S += 15;
    }
    const offset = term.day - S; // >0 超神（符头先到），<0 接气（节气先到），0 正授
    return {
      term: JIEQI[tIdx], termJd: term.jd, leap, offset, headDay: S,
      yuanNo: Math.min(2, Math.floor((dayNum - S) / 5)),
      status: leap ? '置闰' : offset > 0 ? '超神' : offset < 0 ? '接气' : '正授',
    };
  }

  function sixtyIndex(g, z) { for (let i = 0; i < 60; i++) if (i % 10 === g && i % 12 === z) return i; return -1; }

  // ───────────────────────── 排盘主函数 ─────────────────────────
  function chart(y, m, d, h, mi, opts) {
    const o = withDefaults(opts);
    const P = fourPillars(y, m, d, h, mi, o);
    const GODS_USED = o.gods === 'gouque' ? ['值符', '腾蛇', '太阴', '六合', '勾陈', '朱雀', '九地', '九天'] : GODS;
    const steps = {};

    // ① 四柱与节气
    const termIdx = Math.floor(P.lon / 15);
    const termName = JIEQI[termIdx];
    const termJd = solveTerm(termIdx * 15, P.jd - mod(P.lon - termIdx * 15, 360) / 360 * 365.2422);
    const nextIdx = (termIdx + 1) % 24;
    const nextJd = solveTerm(nextIdx * 15, termJd + 15.2);
    steps.pillars = {
      year: ganzhi(P.yearIdx), month: ganzhi(P.monthIdx), day: ganzhi(P.dayIdx), hour: ganzhi(P.hourIdx),
      dayShift: P.dayShift, sunLon: P.lon, clock: fmtDT(P.clock), offsetMin: P.offsetMin, eot: P.eot,
      term: termName, termTime: fmtDT(beijingFromJd(termJd)),
      nextTerm: JIEQI[nextIdx], nextTermTime: fmtDT(beijingFromJd(nextJd)),
    };

    // ② 阴阳遁、三元（拆补法：找符头）、局数
    const dayGan = P.dayIdx % 10;
    const back = dayGan % 5; // 往前几天到甲/己日
    const futouIdx = mod(P.dayIdx - back, 60);
    const futouZhi = futouIdx % 12;
    let yuanNo, juTerm = termName, extra = {};
    if (o.yuan === 'zhirun') {
      const z = zhirun(P.dayNum, o);
      yuanNo = z.yuanNo; juTerm = z.term;
      extra = { status: z.status, offset: z.offset, leap: z.leap, head: ganzhi(mod(z.headDay + 49, 60)), headDate: fmtDT(beijingFromJd(z.headDay)).slice(0, 10) };
    } else if (o.yuan === 'maoshan') {
      const days = P.jd - termJd;
      yuanNo = Math.min(2, Math.floor(days / 5));
      extra = { days };
    } else {
      yuanNo = [0, 2, 1][futouZhi % 3]; // 子午卯酉→上(0) 寅申巳亥→中(1) 辰戌丑未→下(2)
    }
    const yuanName = ['上元', '中元', '下元'][yuanNo];
    const [yy, ...nums] = JU_TABLE[juTerm];
    const yang = yy === '阳';
    const ju = nums[yuanNo];
    const JI = o.ji === 'genkun' && yang ? 8 : 2; // 中五寄宫
    steps.ju = { yang, dun: yang ? '阳遁' : '阴遁', yuan: yuanName, ju, futou: ganzhi(futouIdx), back, tableRow: nums, method: o.yuan, juTerm, ji: JI, ...extra };

      year: QM.ganzhi(P.yearIdx), month: QM.ganzhi(P.monthIdx), day: QM.ganzhi(P.dayIdx), hour: QM.ganzhi(P.hourIdx),
      sunLon: P.lon, clock: QM.fmtDT(P.clock), eot: P.eot, dayShift: P.dayShift,
    };

    // ① 积数、阴阳遁、局
    let acc, kook, yang, accName, unit, accDetail;
    if (o.ji === 'sui') {
      const yy = (m <= 2 && P.lon >= 240 && P.lon < 315) ? y - 1 : y; // 立春换年
      const N = 10153916 + yy, L = N + 1;
      acc = N; kook = cyc(L, 72); yang = true; accName = '积年'; unit = '年';
      const zhou = cyc(L, 360);
      accDetail = { year: yy, N, L, zhou, jiNo: Math.ceil(zhou / 60), ruJi: cyc(zhou, 60), yuan: Math.ceil(zhou / 72) };
    } else {
      const D = civilJdn(P.clock.y, P.clock.m, P.clock.d) - JDN_1900_12_21;
      const hi = Math.floor((P.clock.h + 1) / 2); // 0..12，23 点后为 12（即次日子时）
      const H = (C_SHI + D - 1) * 12 + hi + 1;
      acc = H; kook = cyc(H, 72); accName = '积时'; unit = '时';
      // 冬至至夏至阳遁，夏至至冬至阴遁（按精确时刻）
      yang = P.lon >= 270 || P.lon < 90;
      accDetail = { D, hi, H };
    }
    const dun = yang ? '阳遁' : '阴遁';
    const li = ['理人', '理天', '理地'][kook % 3];
    steps.ju = { ji: o.ji, accName, unit, acc, accText: fmtBig(acc), kook, yang, dun, li, ...accDetail };

    // ② 太乙行宫：小周二十四，三约为宫，不入中五
    const r = cyc(kook, 24);
    const step = Math.floor((r - 1) / 3);
    const seq = yang ? SEQ_YANG : SEQ_YIN;
    const taiyi = seq[step];
    steps.taiyi = { r, step, seq, gong: taiyi, inGong: mod(r - 1, 3) + 1 };

    // ③ 文昌：十八位
    const wcN = cyc(kook, 18);
    const wcSeq = yang ? WC_YANG : WC_YIN;
    const wc = wcSeq[wcN - 1];
    steps.wc = { n: wcN, seq: wcSeq, pos: wc };

    // ④ 计神、合神
    const jsN = cyc(kook, 12);
    const jsSeq = yang ? JS_YANG : JS_YIN;
    const js = jsSeq[jsN - 1];
    const taisui = o.ji === 'sui' ? ZHI[P.yearIdx % 12] : ZHI[P.hourIdx % 12];
    const he = LIUHE[taisui];
    steps.js = { n: jsN, seq: jsSeq, pos: js, taisui, he };

    // ⑤ 始击 = 文昌 − 计神 + 和德（十六神环上计位）
    const sf = RING16[mod(r16(wc) - r16(js) + r16('艮'), 16)];
    steps.sf = { pos: sf, delta: mod(r16(wc) - r16(js), 16) };

    // ⑥ 主客算与将
    const [home, away] = (yang ? CAL_YANG : CAL_YIN)[kook - 1];
    const hg = general(home), hv = vgen(hg), ag = general(away), av = vgen(ag);
    steps.cal = { home, away, hg, hv, ag, av, homeTraits: calTraits(home), awayTraits: calTraits(away) };

    // ⑦ 格局（只判定义明确者）
    const pats = [];
    const add = (name, why, sure = true) => pats.push({ name, why, sure });
    const gOf = (p) => GONG_OF16[p];
    const tyG = taiyi;
    const zheng = ZHENG[tyG], ringD = mod(r16(sf) - r16(zheng), 16);
    // 太乙宫化为十六神位后比较：同位为掩；顺数一位外辰击、逆数一位内辰击；二位为外、内宫击
    if (ringD === 0) add('掩', `始击${sf}与太乙同临${zheng}位`);
    if (gOf(wc) === tyG) add('囚', `文昌${wc}与太乙同在${GONG[tyG].name}宫`);
    [['主大将', hg], ['主参将', hv], ['客大将', ag], ['客参将', av]].forEach(([n, g]) => { if (g === tyG) add('囚', `${n}与太乙同在${GONG[tyG].name}宫`); });
    [['主大将', hg], ['主参将', hv]].forEach(([n1, g1]) => [['客大将', ag], ['客参将', av]].forEach(([n2, g2]) => { if (g1 === g2 && g1 !== 5) add('关', `${n1}与${n2}同在${GONG[g1].name}宫`); }));
    if (gOf(wc) === opposite(tyG)) add('对', `文昌${wc}在太乙对宫${GONG[opposite(tyG)].name}`);
    if (gOf(sf) === opposite(tyG)) add('格', `始击${sf}在太乙对宫${GONG[opposite(tyG)].name}`);
    [['客大将', ag], ['客参将', av]].forEach(([n, g]) => { if (g === opposite(tyG)) add('格', `${n}在太乙对宫${GONG[g].name}`); });
    const JI = { 1: '外辰击', 15: '内辰击', 2: '外宫击', 14: '内宫击' }[ringD];
    if (JI) add('击', `始击${sf}在太乙${zheng}位${ringD < 8 ? '顺' : '逆'}数第 ${ringD < 8 ? ringD : 16 - ringD} 位（${JI}）`);
    const pressers = [['主大将', hg], ['主参将', hv], ['客大将', ag], ['客参将', av]].filter(([, g]) => adjacent(g, tyG));
    pressers.forEach(([n, g]) => add('迫', `${n}在太乙邻宫${GONG[g].name}`));
    const sides = new Set([gOf(sf), hg, hv, ag, av].filter((g) => adjacent(g, tyG)));
    if (sides.size >= 2) add('提挟（疑似）', `太乙${GONG[tyG].name}宫两侧邻宫皆有将神`, false);
    steps.pats = pats;

    return {
      input: { y, m, d, h, mi, text: `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')} ${String(h).padStart(2, '0')}:${String(mi).padStart(2, '0')}` },
      opts: o, steps,
      board: { taiyi, wc, js, he, sf, hg, hv, ag, av },
    };
  }

  function toText(c, question) {
    const S = c.steps, o = c.opts, J = S.ju, L = [];
    const g = (n) => `${n}宫${GONG[n].name}`;
    const p16 = (p) => `${p}（${GOD16[r16(p)]}）`;
    L.push(`【太乙神数】${OPT_TEXT.ji[o.ji]} · 《太乙统宗宝鉴》 · ${OPT_TEXT.dayChange[o.dayChange]} · ${o.solar ? '真太阳时' : '北京时间'}`);
    if (o.solar) L.push(`起式时间：${c.input.text}（北京时间）；真太阳时 ${S.pillars.clock}（东经 ${o.lon}°）`);
    else L.push(`起式时间：${c.input.text}（北京时间，未做真太阳时校正）`);
    L.push(`四柱：${S.pillars.year}年 ${S.pillars.month}月 ${S.pillars.day}日 ${S.pillars.hour}时`);
    if (o.ji === 'sui') L.push(`积年：${fmtBig(J.N)}（${J.year} 年，立春换年），第${J.jiNo}纪入纪第 ${J.ruJi} 年，第${J.yuan}元`);
    else L.push(`积时：${J.accText}（时计以冬至、夏至精确时刻分阴阳遁）`);
    L.push(`局：${J.dun}${J.kook}局（${J.li}）`);
    L.push(`太乙：${g(S.taiyi.gong)}，入宫第 ${S.taiyi.inGong} ${J.unit}（每宫三${J.unit}，不入中五）`);
    L.push(`文昌（天目）：${p16(S.wc.pos)}；计神：${p16(S.js.pos)}；合神：${S.js.he}（${o.ji === 'sui' ? '年' : '时'}支${S.js.taisui}之合）`);
    L.push(`始击（地目）：${p16(S.sf.pos)}，属${g(GONG_OF16[S.sf.pos])}`);
    const C = S.cal;
    L.push(`主算 ${C.home}（${C.homeTraits.join('、')}）：主大将${g(C.hg)}，主参将${g(C.hv)}`);
    L.push(`客算 ${C.away}（${C.awayTraits.join('、')}）：客大将${g(C.ag)}，客参将${g(C.av)}`);
    L.push('');
    L.push('格局（程序按明确定义判定；提挟仅作疑似；四郭固、四郭杜、定算等未排）：');
    if (S.pats.length) for (const p of S.pats) L.push(`- ${p.name}：${p.why}`);
    else L.push('- 未见掩、囚、关、对、格、击、迫');
    L.push('');
    L.push('请你作为熟悉太乙神数的解读者，基于以上式盘：');
    L.push('1. 说明局数、太乙所在宫及入宫远近的含义；');
    L.push('2. 分析文昌、始击与太乙的关系，以及主客算数（长短、三才、无天无地）与主客大将参将的落宫；');
    L.push('3. 结合格局，按主客胜负的思路给出判断与建议；');
    L.push('4. 说明这些结论的不确定性。');
    L.push(`所问之事：${question && question.trim() ? question.trim() : '（未填写，请先给出整体解读）'}`);
    return L.join('\n');
  }

  return { cast, toText, DEFAULT_OPTS, OPT_TEXT, RING16, GOD16, GONG, GONG_OF16, SEQ_YANG, SEQ_YIN, CAL_YANG, CAL_YIN, general, vgen };
});

    $('calBox').classList.add('off');
  }
  const hl = (key, cls = 'hl') => cellOf(key).classList.add(cls);
  function showCells(outer, inner) {
    for (const ch of RING) cellOf(ch).classList.toggle('dim', !outer);
    for (let g = 1; g <= 9; g++) cellOf(g).classList.toggle('dim', !inner);
  }

  // ── 第 k 幕完成后的静态盘面 ──
  function staticState(k) {
    clearMarks();
    const b = B();
    showCells(k >= 1, k >= 1);
    putIn('ty', b.taiyi, k >= 2);
    putOut('wc', b.wc, k >= 3);
    putOut('js', b.js, k >= 4); putOut('he', b.he, k >= 4);
    putOut('sf', b.sf, k >= 5);
    putIn('hg', b.hg, k >= 6); putIn('hv', b.hv, k >= 6); putIn('ag', b.ag, k >= 6); putIn('av', b.av, k >= 6);
    if (k >= 6) showCal(true);
    if (k === 0) { showCounter(S().ju.acc, true); }
    if (k === 2) hl(b.taiyi);
    if (k === 3) hl(b.wc);
    if (k === 4) { hl(b.js); hl(b.he); }
    if (k === 5) hl(b.sf);
    if (k === 7) { $('board').classList.add('done'); markPatterns(); }
  }
  function showCal(on) {
    $('calHomeV').textContent = S().cal.home; $('calAwayV').textContent = S().cal.away;
    $('calBox').classList.toggle('off', !on);
  }
  function showCounter(val, done) {
    const J = S().ju;
    $('counter').classList.remove('off');
    $('cK').textContent = J.accName;
    $('cN').textContent = Math.round(val).toLocaleString('en-US');
    $('cOp').textContent = done ? `÷ 72 余 ${J.kook}` : '';
    $('cRes').textContent = done ? `${J.dun}${J.kook}局` : '';
  }
  function markPatterns() {
    const b = B(), P = S().pats;
    const gOf = (p) => TY.GONG_OF16[p];
    if (P.length) hl(b.taiyi, 'hot');
    for (const p of P) {
      if (/始击/.test(p.why)) hl(b.sf, 'hot');
      if (/文昌/.test(p.why)) hl(b.wc, 'hot');
      for (const [k, n] of [['hg', '主大将'], ['hv', '主参将'], ['ag', '客大将'], ['av', '客参将']]) if (p.why.includes(n)) hl(b[k], 'hot');
    }
    void gOf;
  }

  // ── 各幕动画 ──
  function walkOut(key, path, stepMs, onEach) {
    // 沿十六神格子逐格行进
    setMove(stepMs); setEase('linear');
    path.forEach((ch, i) => later(stepMs * i, () => { putOut(key, ch, true); onEach && onEach(ch, i); }));
    return stepMs * path.length;
  }
  function ringPath(fromCh, toCh) {
    const a = RING.indexOf(fromCh), n = mod(RING.indexOf(toCh) - a, 16);
    return Array.from({ length: n + 1 }, (_, i) => RING[(a + i) % 16]);
  }
  function animate(k, done) {
    const Sx = S(), b = B();
    if (k === 0) {
      const J = Sx.ju, target = J.acc, from = Math.floor(target * 0.97);
      $('counter').classList.remove('off'); showCells(false, false);
      tween(2000, (t) => showCounter(from + (target - from) * (1 - Math.pow(1 - t, 3)), false), () => {
        later(300, () => { $('cOp').textContent = `÷ 72 余 ${J.kook}`; });
        later(900, () => { $('cRes').textContent = `${J.dun}${J.kook}局`; });
        later(2200, done);
      });
      return;
    }
    if (k === 1) {
      showCells(false, false);
      RING.forEach((ch, i) => later(90 * i + 100, () => cellOf(ch).classList.remove('dim')));
      [1, 2, 3, 4, 6, 7, 8, 9, 5].forEach((g, i) => later(90 * 16 + 120 * i + 200, () => cellOf(g).classList.remove('dim')));
      later(90 * 16 + 120 * 9 + 600, done); return;
    }
    if (k === 2) {
      const T = Sx.taiyi, hops = T.seq.slice(0, T.step + 1);
      setMove(380); setEase('ease-in-out');
      hops.forEach((g, i) => later(520 * i + 200, () => { cellsAll().forEach((c) => c.classList.remove('hl')); hl(g); putIn('ty', g, true); }));
      later(520 * hops.length + 300, () => cellOf(T.gong).classList.add('pulse'));
      later(520 * hops.length + 1100, done); return;
    }
    if (k === 3) {
      const W = Sx.wc, path = W.seq.slice(0, W.n);
      const t = walkOut('wc', path, 230, (ch, i) => { cellsAll().forEach((c) => c.classList.remove('hl')); hl(ch); if (i > 0 && path[i - 1] === ch) cellOf(ch).classList.add('pulse'); });
      later(t + 700, () => { setEase('ease-in-out'); done(); }); return;
    }
    if (k === 4) {
      const J = Sx.js, path = J.seq.slice(0, J.n);
      const t = walkOut('js', path, 230, (ch) => { cellsAll().forEach((c) => c.classList.remove('hl')); hl(ch); });
      later(t + 300, () => { setEase('ease-in-out'); putOut('he', b.he, true); hl(b.he); cellOf(b.he).classList.add('pulse'); });
      later(t + 1500, done); return;
    }
    if (k === 5) {
      // 始击 = 文昌 − 计神 + 和德：从和德出发，走“文昌距计神”的格数
      hl(b.wc); hl(b.js);
      later(600, () => { cellsAll().forEach((c) => c.classList.remove('hl')); hl('艮'); cellOf('艮').classList.add('pulse'); putOut('sf', '艮', true); });
      const path = ringPath('艮', b.sf);
      later(1400, () => {
        const t = walkOut('sf', path, 200, (ch) => { cellsAll().forEach((c) => c.classList.remove('hl')); hl(ch); });
        later(t + 700, () => { setEase('ease-in-out'); done(); });
      });
      return;
    }
    if (k === 6) {
      setMove(450); setEase('ease-in-out');
      later(200, () => { $('calHomeV').textContent = Sx.cal.home; $('calAwayV').textContent = ''; $('calBox').classList.remove('off'); hl(5); });
      later(900, () => { putIn('hg', b.hg, true); hl(b.hg); });
      later(1400, () => { putIn('hv', b.hv, true); });
      later(2000, () => { $('calAwayV').textContent = Sx.cal.away; });
      later(2700, () => { putIn('ag', b.ag, true); hl(b.ag); });
      later(3200, () => { putIn('av', b.av, true); });
      later(4000, done); return;
    }
    if (k === 7) {
      $('board').classList.add('done');
      later(300, markPatterns);
      later(1200, done); return;
    }
  }

  // ── 文字 ──
  const gname = (g) => `${GONG[g].name}${g}宫`;
  const p16 = (ch) => `${ch}·${GOD[RING.indexOf(ch)]}`;
  function caption(k) {
    const Sx = S(), b = B(), J = Sx.ju;
    const step = k >= 0 ? `<span class="step">${k + 1} / 8 · ${STAGES[k]}</span>` : '<span class="step">起式</span>';
    const pats = [...new Set(Sx.pats.map((p) => p.name))];
    const t = [
      `${J.accName} ${J.accText}，七十二局一周，得 <b>${J.dun}${J.kook}局</b>`,
      '外列十六神，内布太乙九宫',
      `太乙每宫三${J.unit}，不入中五，今在 <b>${gname(b.taiyi)}</b>`,
      `文昌十八位一周，${J.dun}起${Sx.wc.seq[0]}，今临 <b>${p16(b.wc)}</b>`,
      `计神${J.yang ? '起寅' : '起申'}逆行，今在${b.js}；${Sx.js.taisui}之合神在${b.he}`,
      `始击 = 文昌 − 计神 + 和德，落 <b>${p16(b.sf)}</b>`,
      `主算 ${Sx.cal.home}、客算 ${Sx.cal.away}，主将${gname(b.hg)}，客将${gname(b.ag)}`,
      pats.length ? `见 <b>${pats.join('、')}</b>` : '未见掩囚关格',
    ];
    $('caption').innerHTML = step + `<span>${k >= 0 ? t[k] : esc(C.input.text) + (question ? '　问：' + esc(question) : '')}</span>`;
  }
  function explain(k) {
    const Sx = S(), b = B(), J = Sx.ju, h = (no, t) => `<h2><span class="no">${no + 1}/8</span>${t}</h2>`;
    let x = '';
    if (k === 0) x = h(0, '积数与定局') + (J.ji === 'sui'
      ? `<p>岁计以《统宗》大德七年癸卯积年 10,155,219 推得：积年 = 10,153,916 + 年份。${J.year} 年（立春换年）积年 <span class="mono">${J.N.toLocaleString('en-US')}</span>，加一为算外 <span class="mono">${J.L.toLocaleString('en-US')}</span>。</p><p>以 360 去之余 ${J.zhou}，为第${J.jiNo}纪入纪第 ${J.ruJi} 年；以 72 去之余 <b>${J.kook}</b>，为${J.dun}${J.kook}局（${J.li}）。岁计始终阳遁。</p>`
      : `<p>时计积时 = （基准积日 + 距 1900-12-21 的日数 − 1）× 12 + 时辰序 + 1。今距基准 ${J.D.toLocaleString('en-US')} 日，时辰序 ${J.hi}，积时 <span class="mono">${J.accText}</span>。</p><p>以 72 去之余 <b>${J.kook}</b>。太阳视黄经 ${Sx.pillars.sunLon.toFixed(2)}°，${J.yang ? '冬至后、夏至前，阳遁' : '夏至后、冬至前，阴遁'}，得${J.dun}${J.kook}局（${J.li}）。</p><p class="rule">基准积日 708,011,105 取自 kintaiyi v0.2.4，用于兼容对照，不是《统宗》原文常数。</p>`);
    if (k === 1) x = h(1, '十六神与太乙九宫') + '<p>外圈十六神：子地主、丑阳德、艮和德、寅吕申、卯高丛、辰太阳、巽太炅、巳大神、午大威、未天道、坤大武、申武德、酉太簇、戌阴主、乾阴德、亥大义。</p><p>内圈太乙九宫与洛书不同：一乾、二离、三艮、四震、五中、六兑、七坤、八坎、九巽。</p>';
    if (k === 2) x = h(2, '太乙行宫') + `<p>局数以小周二十四去之余 ${Sx.taiyi.r}，三约之，得第 ${Sx.taiyi.step + 1} 宫、入宫第 ${Sx.taiyi.inGong} ${J.unit}。${J.yang ? '阳遁宫序一二三四六七八九' : '阴遁宫序九八七六四三二一'}，不入中五，太乙在 <b>${gname(b.taiyi)}</b>。</p>`;
    if (k === 3) x = h(3, '文昌（天目）') + `<p>局数以十八去之余 ${Sx.wc.n}。${J.yang ? '阳遁起申（武德）' : '阴遁起寅（吕申）'}顺行十六神，${J.yang ? '遇阴德、大武' : '遇太炅、和德'}重留一算，文昌临 <b>${p16(b.wc)}</b>。</p>`;
    if (k === 4) x = h(4, '计神与合神') + `<p>局数以十二去之余 ${Sx.js.n}。计神${J.yang ? '阳遁起寅' : '阴遁起申'}，逆行十二辰，在 <b>${b.js}</b>。合神为${J.ji === 'sui' ? '年' : '时'}支${Sx.js.taisui}的六合，在 <b>${b.he}</b>。</p>`;
    if (k === 5) x = h(5, '始击（地目）') + `<p>始击 = 文昌 − 计神 + 和德：文昌${b.wc}距计神${b.js}顺数 ${Sx.sf.delta} 位，从和德（艮）顺行 ${Sx.sf.delta} 位，落 <b>${p16(b.sf)}</b>，属${gname(TY.GONG_OF16[b.sf])}。</p>`;
    if (k === 6) x = h(6, '主客算与大将参将') + `<ul><li>主算 <b>${Sx.cal.home}</b>（${Sx.cal.homeTraits.join('、')}）：主大将${gname(Sx.cal.hg)}，主参将${gname(Sx.cal.hv)}</li><li>客算 <b>${Sx.cal.away}</b>（${Sx.cal.awayTraits.join('、')}）：客大将${gname(Sx.cal.ag)}，客参将${gname(Sx.cal.av)}</li></ul><p class="rule">主算从文昌起、客算从始击起，依宫数算至太乙前一宫而止；本页按《统宗》局例校过的七十二局表取数。大将：算去十取零，整十取十位；参将：大将三因去十。</p>`;
    if (k === 7) x = h(7, '格局') + (Sx.pats.length ? `<ul>${Sx.pats.map((p) => `<li><b>${p.name}</b>：${p.why}</li>`).join('')}</ul>` : '<p>未见掩、囚、关、对、格、击、迫。</p>') + '<p class="rule">掩：始击临太乙宫正位。击：始击在太乙正位相邻之辰或相邻之宫。囚：文昌或主客将与太乙同宫。关：主将与客将同宫。对：文昌在太乙对宫。格：始击或客将在太乙对宫。迫：主客将在太乙邻宫。提挟只作疑似；四郭固、四郭杜未排。</p>';
    $('explain').innerHTML = x;
  }
  function showMeta(k) {
    const Sx = S(), J = Sx.ju, parts = [];
    parts.push(`<span><b>${Sx.pillars.year} ${Sx.pillars.month} ${Sx.pillars.day} ${Sx.pillars.hour}</b></span>`);
    parts.push(`<span>${TY.OPT_TEXT.ji[J.ji]}${k >= 0 ? ` · <b>${J.dun}${J.kook}局</b>` : ''}</span>`);
    if (k >= 2) parts.push(`<span>太乙 <b>${gname(B().taiyi)}</b></span>`);
    $('meta').innerHTML = parts.join('');
  }

  // ── 阶段与三幕 ──
  STAGES.forEach((name, i) => {
    const li = document.createElement('li'); const b = document.createElement('button');
    b.type = 'button'; b.textContent = `${i + 1} ${name}`; b.addEventListener('click', () => playStage(i));
    li.appendChild(b); $('stages').appendChild(li);
  });
  function markStages() { [...$('stages').querySelectorAll('button')].forEach((b, i) => (i === stage ? b.setAttribute('aria-current', 'step') : b.removeAttribute('aria-current'))); }
  function blank() { clearMarks(); showCells(false, false); for (const c of Object.values(chips)) c.classList.add('off'); }
  function jump(k) {
    clearTimers(); setMove(0); setEase('ease-in-out');
    stage = k; if (k >= 0) staticState(k); else blank();
    if (k >= 0) explain(k); caption(k); showMeta(k); markStages();
    requestAnimationFrame(() => setMove(300));
  }
  function playStage(k) {
    return new Promise((res) => {
      clearTimers(); setMove(0); setEase('ease-in-out');
      if (k > 0) staticState(k - 1); else blank();
      stage = k; explain(k); caption(k); showMeta(k); markStages();
      requestAnimationFrame(() => { setMove(300); animate(k, res); });
    });
  }
  const wait = (ms) => new Promise((r) => later(ms, r));
  function setPhase(ph) {
    $('intro').hidden = ph !== 'intro';
    $('theater').hidden = ph === 'intro';
    $('brand').hidden = ph === 'intro';
    $('skip').hidden = ph !== 'ritual';
    $('caption').hidden = ph !== 'ritual';
    $('theater').classList.toggle('solo', ph === 'ritual');
    if (ph !== 'ritual') $('seal').classList.add('off');
    window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
  }
  function showTab(t) {
    for (const b of $('tabs').querySelectorAll('button')) b.setAttribute('aria-selected', String(b.dataset.tab === t));
    $('pane-raw').hidden = t !== 'raw'; $('pane-process').hidden = t !== 'process';
  }
  $('tabs').addEventListener('click', (e) => { const t = e.target.closest('button')?.dataset.tab; if (!t) return; showTab(t); jump(7); });

  async function ritual() {
    const my = ++runToken;
    setPhase('ritual');
    $('theater').classList.remove('fade-in'); void $('theater').offsetWidth; $('theater').classList.add('fade-in');
    jump(-1);
    await wait(500); if (my !== runToken) return;
    for (let k = 0; k < STAGES.length; k++) { await playStage(k); if (my !== runToken) return; }
    $('seal').classList.remove('off');
    await wait(1800); if (my !== runToken) return;
    finish();
  }
  function finish() { runToken++; clearTimers(); jump(7); setPhase('result'); showTab('raw'); }
  $('skip').addEventListener('click', finish);
  $('again').addEventListener('click', () => { runToken++; clearTimers(); setPhase('intro'); $('dt').value = beijingNow(); updateNotes(); });

  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  $('copy').addEventListener('click', () => {
    const t = $('out').textContent;
    const ok = () => { $('copy').textContent = '已复制'; setTimeout(() => ($('copy').textContent = '复制文本'), 1600); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($('out')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $('copy').textContent = '已选中，按 Ctrl+C 复制'; };
    try { navigator.clipboard.writeText(t).then(ok, fallback); } catch (e) { fallback(); }
  });

  // ── 设置（记在本机浏览器里）──
  const pad = (n) => String(n).padStart(2, '0');
  function beijingNow() { const d = new Date(Date.now() + 8 * 3600e3); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}T${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; }
  const OPT_KEY = 'taiyi-opts-v1';
  function readOpts() { const lon = parseFloat($('o-lon').value); return { ji: $('o-ji').value, dayChange: +$('o-day').value, solar: $('o-solar').checked, lon: isFinite(lon) ? lon : 120 }; }
  const optSummary = (o) => `${TY.OPT_TEXT.ji[o.ji]} · ${TY.OPT_TEXT.dayChange[o.dayChange]} · ${o.solar ? '真太阳时 ' + o.lon + '°' : '北京时间'}`;
  function parseDt() { const v = $('dt').value; if (!v) return null; const [ds, ts] = v.split('T'); const [y, m, d] = ds.split('-').map(Number); const [hh, mm] = ts.split(':').map(Number); return [y, m, d, hh, mm]; }
  function impact(id, same, html) { const el = $('i-' + id); el.hidden = false; el.className = 'impact ' + (same ? 'same' : 'diff'); el.innerHTML = html; }
  const juOf = (c) => `${c.steps.ju.dun}${c.steps.ju.kook}局，太乙在${gname(c.board.taiyi)}`;
  function updateNotes() {
    const a = parseDt(); if (!a) return; const o = readOpts();
    try {
      const s1 = TY.cast(...a, Object.assign({}, o, { ji: 'shi' })), s2 = TY.cast(...a, Object.assign({}, o, { ji: 'sui' }));
      impact('ji', false, `按你填的时间：时计为${juOf(s1)}；岁计为${juOf(s2)}。<b>两者看的范围不同，结果一般不同。</b>`);
      const t1 = TY.cast(...a, Object.assign({}, o, { solar: true })), t0 = TY.cast(...a, Object.assign({}, o, { solar: false }));
      const same = t1.steps.ju.kook === t0.steps.ju.kook && t1.steps.ju.yang === t0.steps.ju.yang;
      impact('solar', same, `东经 ${o.lon}° 的真太阳时为 ${t1.steps.pillars.clock.slice(11)}。` + (o.ji === 'sui' ? '<b>岁计按年份起局，不受影响。</b>' : same ? '<b>仍在同一时辰，局数相同。</b>' : `<b>时辰会变，局数从${t0.steps.ju.kook}局变成${t1.steps.ju.kook}局。</b>`));
    } catch (e) { /* 时间不完整时不显示 */ }
  }
  function syncOpts() {
    FancySelect.refreshAll();
    const o = readOpts();
    $('optSum').textContent = optSummary(o);
    $('sub').textContent = '太乙统宗宝鉴 · ' + TY.OPT_TEXT.ji[o.ji];
    $('o-lon').disabled = !o.solar;
    updateNotes();
    try { localStorage.setItem(OPT_KEY, JSON.stringify(o)); } catch (e) { /* 无痕模式等 */ }
  }
  (function loadOpts() {
    let o = null;
    try { o = JSON.parse(localStorage.getItem(OPT_KEY) || 'null'); } catch (e) { o = null; }
    o = Object.assign({}, TY.DEFAULT_OPTS, o || {});
    $('o-ji').value = o.ji; $('o-day').value = String(o.dayChange); $('o-solar').checked = !!o.solar; $('o-lon').value = o.lon;
  })();
  for (const id of ['o-ji', 'o-day', 'o-solar', 'o-lon']) $(id).addEventListener('change', syncOpts);
  $('o-lon').addEventListener('input', updateNotes);
  $('dt').addEventListener('input', updateNotes); $('dt').addEventListener('change', updateNotes);

  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const a = parseDt(); if (!a) return;
    question = $('q').value.trim();
    C = TY.cast(...a, readOpts());
    $('foot').textContent = `本式设置：${optSummary(C.opts)}。主派《太乙统宗宝鉴》，以《太乙金镜式经》校勘；七十二局主客算表与《统宗》卷四、卷五局例对校一致。时计积日基准取自 kintaiyi v0.2.4（兼容对照，非原书常数）。定算、四神、天乙、地乙、直符、飞符、四郭固杜、月计、日计暂不排。`;
    build();
    $('out').textContent = TY.toText(C, question);
    ritual();
  });
  $('dt').value = beijingNow();
  syncOpts();
})();
</script>
</body>
</html>
