<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>奇门遁甲排盘演示</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 三幕：起局（只见时间与所问）→ 排盘（九宫盘 + 旁白，自动推进，可跳过）→ 解盘（盘面 + 解读 / 过程 / 原文） */
:root {
  --bg: #e9eeec;
  --surface: #f7f9f8;
  --cell: #fbfcfb;
  --ink: #17212a;
  --muted: #5a6870;
  --line: #c4cfcc;
  --accent: #2c5a86;      /* 靛青：八门、交互 */
  --gold: #9a6f12;        /* 九星 */
  --cinnabar: #b0362a;    /* 八神、凶、强调 */
  --jade: #2f7a5c;        /* 吉 */
  --hl: rgba(44, 90, 134, .14);
  --f-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1418; --surface: #151e24; --cell: #19242b; --ink: #e1e8e6; --muted: #8fa0a7; --line: #2b3a42;
    --accent: #84aedb; --gold: #d9b25e; --cinnabar: #e8705f; --jade: #6cc39c; --hl: rgba(132, 174, 219, .16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1418; --surface: #151e24; --cell: #19242b; --ink: #e1e8e6; --muted: #8fa0a7; --line: #2b3a42;
  --accent: #84aedb; --gold: #d9b25e; --cinnabar: #e8705f; --jade: #6cc39c; --hl: rgba(132, 174, 219, .16);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 48px;
}
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
.label { font-size: 12px; letter-spacing: .14em; color: var(--muted); }
input, textarea { font: inherit; color: var(--ink); background: var(--cell); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; width: 100%; }
input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--cell); color: var(--ink); padding: 8px 14px; }
button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; }
button.primary:hover:not(:disabled) { color: var(--surface); filter: brightness(1.08); }
.fade-in { animation: fadein .7s ease both; }
@keyframes fadein { from { opacity: 0; transform: translateY(8px); } }

/* 顶栏 */
.top { max-width: 1180px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: space-between; min-height: 36px; }
.brand { font-family: var(--f-display); font-weight: 900; letter-spacing: .3em; font-size: 15px; color: var(--muted); }
#skip { font-size: 13px; padding: 6px 16px; border-radius: 999px; }

/* 第一幕：起局 */
#intro { display: grid; place-items: center; padding-block: 2vh 6vh; }
.altar { position: relative; width: 100%; max-width: 440px; padding-top: 140px; display: grid; gap: 22px; justify-items: center; text-align: center; }
.bagua { position: absolute; left: 50%; top: 210px; width: min(400px, 92vw); aspect-ratio: 1; transform: translate(-50%, -50%); pointer-events: none; opacity: .55; }
.bagua svg { width: 100%; height: 100%; animation: spin 160s linear infinite; }
.bagua text { fill: var(--muted); font-family: var(--f-display); }
.bagua circle { fill: none; stroke: var(--line); }
@keyframes spin { to { transform: rotate(360deg); } }
.altar h1 { position: relative; font-size: clamp(44px, 12vw, 72px); font-weight: 900; letter-spacing: .18em; margin-right: -.18em; line-height: 1.1; padding-top: 30px; }
.altar .sub { position: relative; color: var(--muted); font-size: 14px; letter-spacing: .2em; margin-top: -10px; }
.altar form { position: relative; width: 100%; display: grid; gap: 14px; text-align: left; margin-top: 56px; }
.altar .field { display: grid; gap: 6px; }
#go { white-space: nowrap; justify-self: center; margin-top: 8px; padding: 12px 44px; font-size: 18px; letter-spacing: .5em; font-family: var(--f-display); border-radius: 999px; }
#go span { margin-right: -.5em; }
.altar .hint { position: relative; font-size: 12.5px; color: var(--muted); margin: 0; }

/* 第二、三幕：盘 + 侧栏；排盘时只留盘和一行旁白，居中 */
#theater.solo { grid-template-columns: minmax(0, 620px); justify-content: center; }
#theater.solo .side { display: none; }
.caption { min-height: 3.4em; text-align: center; font-family: var(--f-display); font-size: clamp(16px, 2.4vw, 19px); line-height: 1.7; text-wrap: balance; }
.caption .step { display: block; font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.caption > * { animation: fadein .45s ease both; }
.caption b { color: var(--cinnabar); }
.board.dial .cell { opacity: .35; }
.paths .dialg text { fill: var(--muted); font-family: var(--f-display); font-size: 7px; }
.dialg .ring { fill: none; stroke: var(--line); stroke-width: 1; }
.dialg .tick { stroke: var(--muted); stroke-width: .8; }
.dialg .sun { fill: var(--gold); }
.dialg .sunglow { fill: var(--gold); opacity: .25; }
.dialg .arc { fill: none; stroke: var(--gold); stroke-width: 2.5; opacity: .7; }
.paths .dialg .now { fill: var(--ink); font-size: 10px; font-weight: 700; }
.chip.stamp { font-family: var(--f-display); font-weight: 900; color: var(--cinnabar); font-size: clamp(20px, 4vw, 30px); border: 2px solid var(--cinnabar); border-radius: 6px; padding: 2px 8px; background: var(--cell); }
.chip.stamp.off { transform: translate(-50%, -50%) scale(1.8); }
.seal { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(1); z-index: 3; pointer-events: none;
  font-family: var(--f-display); font-weight: 900; font-size: clamp(34px, 8vw, 60px); line-height: 1.05; color: var(--cinnabar);
  border: 4px solid var(--cinnabar); border-radius: 10px; padding: 10px 14px; background: var(--cell); writing-mode: vertical-rl; letter-spacing: .1em;
  transition: opacity .5s, transform .5s cubic-bezier(.2, 1.4, .4, 1); }
.seal.off { opacity: 0; transform: translate(-50%, -50%) scale(1.6); }
@media (max-width: 600px) { .board.filled .pname { display: none; } }
.board.done .cell { box-shadow: inset 0 0 0 1px var(--gold); }
#theater { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 880px) { #theater { grid-template-columns: minmax(0, 1fr); } }
.boardbox { display: grid; gap: 8px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; font-size: 13px; color: var(--muted); min-height: 21px; }
.meta b { color: var(--ink); font-family: var(--f-display); }
.compass { display: flex; justify-content: space-between; font-family: var(--f-display); color: var(--muted); font-size: 13px; }
.board { position: relative; width: 100%; max-width: 600px; aspect-ratio: 1; margin: 0 auto; }
.grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4px; }
.cell { position: relative; background: var(--cell); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; transition: background .3s, box-shadow .3s; }
.cell .gua { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 900; font-size: clamp(42px, 9vw, 84px); color: var(--ink); opacity: .06; pointer-events: none; }
.cell .pname { position: absolute; left: 50%; bottom: 3px; transform: translateX(-50%); font-size: 10.5px; color: var(--muted); white-space: nowrap; letter-spacing: .05em; }
.cell.hl { background: var(--hl); box-shadow: inset 0 0 0 2px var(--accent); }
.cell.hot { box-shadow: inset 0 0 0 2px var(--cinnabar); }
.cell.pulse { animation: pulse 1s ease-in-out 2; }
@keyframes pulse { 50% { box-shadow: inset 0 0 0 4px var(--accent); } }
.paths { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.paths polyline { fill: none; stroke: var(--cinnabar); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
.paths circle { fill: var(--cinnabar); }
.paths text { fill: var(--cinnabar); font-family: var(--f-mono); font-size: 9px; }
.chips { position: absolute; inset: 0; pointer-events: none; }
.chip { position: absolute; transform: translate(-50%, -50%) scale(1); white-space: nowrap; line-height: 1.1;
  transition: left var(--mv, .32s) ease-in-out, top var(--mv, .32s) ease-in-out, opacity .35s, transform .35s; }
.chip.off { opacity: 0; transform: translate(-50%, -50%) scale(.6); }
.chip.star { font-family: var(--f-display); font-weight: 700; color: var(--gold); font-size: clamp(14px, 2.5vw, 20px); }
.chip.qin { font-family: var(--f-display); color: var(--gold); font-size: clamp(10px, 1.7vw, 13px); }
.chip.door { color: var(--accent); font-weight: 700; font-size: clamp(12px, 2vw, 16px); }
.chip.god { color: var(--cinnabar); font-size: clamp(11px, 1.8vw, 14px); font-weight: 500; }
.chip.tian { font-family: var(--f-display); font-weight: 900; font-size: clamp(16px, 2.8vw, 22px); color: var(--ink); }
.chip.di { font-family: var(--f-display); font-weight: 700; font-size: clamp(15px, 2.6vw, 20px); color: var(--muted); }
.chip.badge { font-size: 10px; color: var(--surface); background: var(--cinnabar); padding: 1px 4px; border-radius: 3px; }
.chip.badge.ma { background: var(--jade); }
.chip.key { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; font-size: 12px; color: var(--muted); }
.legend b { font-weight: 700; }

.side { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.progress { display: flex; gap: 6px; }
.progress span { flex: 1; height: 3px; border-radius: 2px; background: var(--line); transition: background .4s; }
.progress span.on { background: var(--accent); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 12px; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }
.pane { display: grid; gap: 12px; min-width: 0; }

.explain { min-height: 240px; display: grid; gap: 10px; align-content: start; }
.explain h2 { font-size: 24px; }
.explain h2 .no { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-weight: 400; margin-right: 8px; }
.explain p { margin: 0; max-width: 62ch; }
.explain .rule { font-size: 13px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; }
.explain > * { animation: fadein .5s ease both; }
.explain > *:nth-child(2) { animation-delay: .15s; } .explain > *:nth-child(3) { animation-delay: .3s; } .explain > *:nth-child(4) { animation-delay: .45s; } .explain > *:nth-child(n+5) { animation-delay: .6s; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.kv div { background: var(--cell); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
.kv span { display: block; font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.kv b { font-family: var(--f-display); font-size: 22px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.yuan { display: flex; gap: 6px; }
.yuan span { flex: 1; text-align: center; border: 1px solid var(--line); border-radius: 6px; padding: 4px 0; font-family: var(--f-mono); color: var(--muted); }
.yuan span.on { border-color: var(--accent); background: var(--hl); color: var(--ink); font-weight: 600; }
.pat { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
.pat li { display: flex; gap: 8px; align-items: baseline; }
.tag { font-size: 11px; padding: 0 5px; border-radius: 3px; border: 1px solid currentColor; flex: none; }
.tag.凶 { color: var(--cinnabar); } .tag.吉 { color: var(--jade); } .tag.平 { color: var(--muted); }
.stages { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.stages button { padding: 4px 9px; font-size: 13px; }
.stages button[aria-current="step"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }

.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.small { font-size: 12.5px; color: var(--muted); max-width: 70ch; margin: 0; }
pre#out { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.7; background: var(--cell); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; max-height: 560px; overflow: auto; }
@media (prefers-reduced-motion: reduce) { .chip, .cell, .seal, .caption > * { transition: none !important; animation: none !important; } .bagua svg, .explain > *, .fade-in, .thinking i { animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <span class="brand" id="brand" hidden>奇门遁甲</span><span></span>
  <button type="button" id="skip" hidden>跳过 ›</button>
</header>

<!-- 第一幕：起局 -->
<section id="intro">
  <div class="altar fade-in">
    <div class="bagua" aria-hidden="true"><svg viewBox="-100 -100 200 200" id="bagua"></svg></div>
    <h1>奇门遁甲</h1>
    <div class="sub">时家转盘 · 拆补法</div>
    <form id="form">
      <div class="field">
        <label class="label" for="dt">起局时间（北京时间）</label>
        <input id="dt" type="datetime-local" required>
      </div>
      <div class="field">
        <label class="label" for="q">所问之事</label>
        <textarea id="q" rows="2" placeholder="心中默念所问，写在这里。例如：下个月换工作是否顺利"></textarea>
      </div>
      <button type="submit" class="primary" id="go"><span>起局</span></button>
    </form>
    <p class="hint">所问之事会写进盘面原文，排完后可以复制给 AI 解读。</p>
  </div>
</section>

<!-- 第二、三幕：排盘与解盘 -->
<section id="theater" hidden>
  <div class="boardbox">
    <div class="meta" id="meta"></div>
    <div class="compass"><span>东南 巽</span><span>南 · 离</span><span>坤 西南</span></div>
    <div class="board" id="board">
      <div class="grid" id="grid"></div>
      <svg class="paths" id="paths" viewBox="0 0 300 300" preserveAspectRatio="none"></svg>
      <div class="chips" id="chips"></div>
      <div class="seal off" id="seal" aria-hidden="true">盘成</div>
    </div>
    <div class="caption" id="caption" aria-live="polite" hidden></div>
    <div class="compass"><span>东北 艮</span><span>北 · 坎</span><span>乾 西北</span></div>
    <div class="legend"><span><b style="color:var(--cinnabar)">红</b> 八神</span><span><b style="color:var(--gold)">金</b> 九星</span><span><b style="color:var(--ink)">黑</b> 天盘干</span><span><b style="color:var(--accent)">蓝</b> 八门</span><span><b style="color:var(--muted)">灰</b> 地盘干</span></div>
  </div>

  <aside class="side">
    <div class="progress" id="progress"></div>
    <div class="tabs" id="tabs" role="tablist" hidden>
      <button type="button" role="tab" data-tab="raw" aria-selected="true">盘面原文</button>
      <button type="button" role="tab" data-tab="process" aria-selected="false">排盘过程</button>
    </div>

    <div class="pane" id="pane-process">
      <ol class="stages" id="stages" hidden></ol>
      <div class="explain" id="explain" aria-live="polite"></div>
    </div>

    <div class="pane" id="pane-raw" hidden>
      <div class="row"><button type="button" id="copy">复制文本</button><span class="small">可以粘贴给任何 AI 解读。</span></div>
      <pre id="out"></pre>
      <p class="small">节气用截断 VSOP87 自行计算，误差在 1 分钟以内。时间按北京时间处理，没有做真太阳时校正。本页采用拆补法、中五寄坤二。</p>
    </div>

    <div class="row" id="againRow" hidden><button type="button" id="again">重新起局</button></div>
  </aside>
</section>

<script>
/*
 * 奇门遁甲 · 时家转盘 · 拆补法 —— 纯算法核心（无依赖）
 * 浏览器中挂到 window.QM；Node 中 module.exports。
 *
 * 包含：
 *   - 太阳视黄经（截断 VSOP87 + 章动 + 光行差，精度约数角秒 ≈ 1 分钟内）
 *   - 节气时刻求解、四柱干支（立春换年、节换月、23 点换日）
 *   - 起局：阴阳遁、三元（拆补法）、局数
 *   - 地盘、旬首、值符值使、天盘九星、人盘八门、神盘八神、空亡、驿马、格局
 * 每一步都把中间过程写进 steps，供页面做分阶段动画。
 */
(function (root, factory) {
  const QM = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = QM;
  else root.QM = QM;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ───────────────────────── 基础表 ─────────────────────────
  const GAN = '甲乙丙丁戊己庚辛壬癸'.split('');
  const ZHI = '子丑寅卯辰巳午未申酉戌亥'.split('');
  const ganzhi = (i) => GAN[((i % 10) + 10) % 10] + ZHI[((i % 12) + 12) % 12];
  const mod = (a, n) => ((a % n) + n) % n;

  // 24 节气，以视黄经 0°（春分）为起点，每 15° 一个
  const JIEQI = ['春分', '清明', '谷雨', '立夏', '小满', '芒种', '夏至', '小暑', '大暑', '立秋', '处暑', '白露',
    '秋分', '寒露', '霜降', '立冬', '小雪', '大雪', '冬至', '小寒', '大寒', '立春', '雨水', '惊蛰'];

  // 局数表：节气 → [阴/阳, 上元, 中元, 下元]
  const JU_TABLE = {
    冬至: ['阳', 1, 7, 4], 惊蛰: ['阳', 1, 7, 4], 小寒: ['阳', 2, 8, 5], 大寒: ['阳', 3, 9, 6], 春分: ['阳', 3, 9, 6],
    立春: ['阳', 8, 5, 2], 雨水: ['阳', 9, 6, 3], 清明: ['阳', 4, 1, 7], 立夏: ['阳', 4, 1, 7], 谷雨: ['阳', 5, 2, 8],
    小满: ['阳', 5, 2, 8], 芒种: ['阳', 6, 3, 9],
    夏至: ['阴', 9, 3, 6], 白露: ['阴', 9, 3, 6], 小暑: ['阴', 8, 2, 5], 大暑: ['阴', 7, 1, 4], 秋分: ['阴', 7, 1, 4],
    立秋: ['阴', 2, 5, 8], 处暑: ['阴', 1, 4, 7], 寒露: ['阴', 6, 9, 3], 立冬: ['阴', 6, 9, 3], 霜降: ['阴', 5, 8, 2],
    小雪: ['阴', 5, 8, 2], 大雪: ['阴', 4, 7, 1],
  };

  // 九宫信息（洛书数）
  const PALACE = {
    1: { gua: '坎', dir: '正北', wx: '水' }, 2: { gua: '坤', dir: '西南', wx: '土' }, 3: { gua: '震', dir: '正东', wx: '木' },
    4: { gua: '巽', dir: '东南', wx: '木' }, 5: { gua: '中', dir: '中宫', wx: '土' }, 6: { gua: '乾', dir: '西北', wx: '金' },
    7: { gua: '兑', dir: '正西', wx: '金' }, 8: { gua: '艮', dir: '东北', wx: '土' }, 9: { gua: '离', dir: '正南', wx: '火' },
  };
  // 八宫顺时针环（坎→艮→震→巽→离→坤→兑→乾）

  // 日地距离 R0..R1（光行差只需粗略值）
  const VR = [
    [[100013989, 0, 0], [1670700, 3.0984635, 6283.07585], [13956, 3.05525, 12566.1517], [3084, 5.1985, 77713.7715],

  const sumSeries = (S, t) => {
    let r = 0, tp = 1;
    for (const terms of S) {
      let s = 0;
      for (const [a, b, c] of terms) s += a * Math.cos(b + c * t);
      r += s * tp; tp *= t;
    }
    return r / 1e8;
  };

  // ΔT（秒），Espenak & Meeus 多项式
  function deltaT(y) {
    if (y < 1900) { const t = (y - 1820) / 100; return -20 + 32 * t * t; }
    if (y < 1920) { const t = y - 1900; return -2.79 + 1.494119 * t - 0.0598939 * t * t + 0.0061966 * t ** 3 - 0.000197 * t ** 4; }
    if (y < 1941) { const t = y - 1920; return 21.2 + 0.84493 * t - 0.0761 * t * t + 0.0020936 * t ** 3; }
    if (y < 1961) { const t = y - 1950; return 29.07 + 0.407 * t - t * t / 233 + t ** 3 / 2547; }
    if (y < 1986) { const t = y - 1975; return 45.45 + 1.067 * t - t * t / 260 - t ** 3 / 718; }
    if (y < 2005) { const t = y - 2000; return 63.86 + 0.3345 * t - 0.060374 * t * t + 0.0017275 * t ** 3 + 0.000651814 * t ** 4 + 0.00002373599 * t ** 5; }
    if (y < 2050) { const t = y - 2000; return 62.92 + 0.32217 * t + 0.005589 * t * t; }
    if (y < 2150) return -20 + 32 * ((y - 1820) / 100) ** 2 - 0.5628 * (2150 - y);
    const u = (y - 1820) / 100; return -20 + 32 * u * u;
  }

  // 太阳视黄经（度），参数为力学时儒略日 JDE
  function sunApparentLon(jde) {
    const t = (jde - 2451545) / 365250;
    const L = sumSeries(VL, t);
    const R = sumSeries(VR, t);
    let lon = L * 180 / Math.PI + 180; // 地心
    const T = t * 10;
    lon += -0.09033 / 3600; // FK5
    const om = (125.04452 - 1934.136261 * T) * Math.PI / 180;
    const Ls = (280.4665 + 36000.7698 * T) * Math.PI / 180;
    const Lm = (218.3165 + 481267.8813 * T) * Math.PI / 180;
    const dpsi = -17.2 * Math.sin(om) - 1.32 * Math.sin(2 * Ls) - 0.23 * Math.sin(2 * Lm) + 0.21 * Math.sin(2 * om);
    lon += dpsi / 3600;
    lon += -20.4898 / 3600 / R; // 光行差
    return mod(lon, 360);
  }

  // 公历（北京时间）↔ 儒略日（UT）
  function jdFromBeijing(y, m, d, h = 0, mi = 0, s = 0) {
    const ms = Date.UTC(y, m - 1, d, h, mi, s) - 8 * 3600e3;
    return ms / 86400e3 + 2440587.5;
  }
  function beijingFromJd(jd) {
    const dt = new Date(Math.round((jd - 2440587.5) * 86400e3 + 8 * 3600e3));
    return { y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate(), h: dt.getUTCHours(), mi: dt.getUTCMinutes(), s: dt.getUTCSeconds() };
  }
  const jdeOf = (jd) => { const y = beijingFromJd(jd).y; return jd + deltaT(y) / 86400; };
  const sunLonAtJd = (jd) => sunApparentLon(jdeOf(jd));

  // 求太阳到达 target 度的时刻（UT 儒略日），从 guess 附近迭代
  function solveTerm(target, guess) {
    let jd = guess;
    for (let i = 0; i < 20; i++) {
      const diff = mod(target - sunLonAtJd(jd) + 180, 360) - 180;
      jd += diff / 360 * 365.2422;
      if (Math.abs(diff) < 1e-7) break;
    }
    return jd;
  }

  const pad = (n) => String(n).padStart(2, '0');
  const fmtDT = (o) => `${o.y}-${pad(o.m)}-${pad(o.d)} ${pad(o.h)}:${pad(o.mi)}`;

  // ───────────────────────── 四柱 ─────────────────────────
  function fourPillars(y, m, d, h, mi) {
    const jd = jdFromBeijing(y, m, d, h, mi);
    const lon = sunLonAtJd(jd);

    // 年柱：立春（315°）换年
    let yy = y;
    if (m <= 2 && lon >= 240 && lon < 315) yy = y - 1;
    const yearIdx = mod(yy - 4, 60);

    // 月柱：节换月；寅月从 315° 起，每 30° 一月
    const mOrder = Math.floor(mod(lon - 315, 360) / 30); // 0 = 寅月
    const monthGan = mod((yearIdx % 10 % 5) * 2 + 2 + mOrder, 10);
    const monthZhi = mod(2 + mOrder, 12);
    const monthIdx = sixtyIndex(monthGan, monthZhi);

    // 日柱：23 点后算次日（早晚子时不分）
    const civilNoonJdn = Math.floor(Date.UTC(y, m - 1, d) / 86400e3 + 2440587.5 + 0.5);
    const dayShift = h >= 23 ? 1 : 0;
    const dayIdx = mod(civilNoonJdn + dayShift + 49, 60);

    // 时柱：五鼠遁
    const hourZhi = Math.floor((h + 1) / 2) % 12;
    const hourGan = mod((dayIdx % 10 % 5) * 2 + hourZhi, 10);
    const hourIdx = sixtyIndex(hourGan, hourZhi);

    return { jd, lon, yearIdx, monthIdx, dayIdx, hourIdx, dayShift };
  }
  function sixtyIndex(g, z) { for (let i = 0; i < 60; i++) if (i % 10 === g && i % 12 === z) return i; return -1; }

  // ───────────────────────── 排盘主函数 ─────────────────────────
  function chart(y, m, d, h, mi) {
    const P = fourPillars(y, m, d, h, mi);
    const steps = {};

    // ① 四柱与节气
    const termIdx = Math.floor(P.lon / 15);
    const termName = JIEQI[termIdx];
    const termJd = solveTerm(termIdx * 15, P.jd - mod(P.lon - termIdx * 15, 360) / 360 * 365.2422);
    const nextIdx = (termIdx + 1) % 24;
    const nextJd = solveTerm(nextIdx * 15, termJd + 15.2);
    steps.pillars = {
      year: ganzhi(P.yearIdx), month: ganzhi(P.monthIdx), day: ganzhi(P.dayIdx), hour: ganzhi(P.hourIdx),
      dayShift: P.dayShift, sunLon: P.lon,
      term: termName, termTime: fmtDT(beijingFromJd(termJd)),
      nextTerm: JIEQI[nextIdx], nextTermTime: fmtDT(beijingFromJd(nextJd)),
    };

    // ② 阴阳遁、三元（拆补法：找符头）、局数
    const dayGan = P.dayIdx % 10;
    const back = dayGan % 5; // 往前几天到甲/己日
    const futouIdx = mod(P.dayIdx - back, 60);
    const futouZhi = futouIdx % 12;
    const yuanNo = [0, 2, 1][futouZhi % 3]; // 子午卯酉→上(0) 寅申巳亥→中(1) 辰戌丑未→下(2)
    const yuanName = ['上元', '中元', '下元'][yuanNo];
    const [yy, ...nums] = JU_TABLE[termName];
    const yang = yy === '阳';
    const ju = nums[yuanNo];
    steps.ju = { yang, dun: yang ? '阳遁' : '阴遁', yuan: yuanName, ju, futou: ganzhi(futouIdx), back, tableRow: nums };

    // ③ 地盘：三奇六仪从局数宫起，阳顺阴逆飞布九宫
    const di = {}; const diOrder = [];
    for (let i = 0; i < 9; i++) {
      const p = yang ? mod(ju - 1 + i, 9) + 1 : mod(ju - 1 - i, 9) + 1;
      di[p] = SANQI_LIUYI[i]; diOrder.push({ palace: p, stem: SANQI_LIUYI[i] });
    }
    const stemPalace = (s) => +Object.keys(di).find((k) => di[k] === s);
    steps.di = { order: diOrder };

    // ④ 旬首、值符、值使
    const xun = Math.floor(P.hourIdx / 10);
    const xunName = ganzhi(xun * 10);
    const xunYi = XUN_YI[xun];
    const xunPalace = stemPalace(xunYi);
    const zhifuStar = STAR_HOME[xunPalace]; // 落中五则为天禽
    const zhishiDoor = DOOR_HOME[xunPalace === 5 ? 2 : xunPalace];
    const kongZhi = [ZHI[mod(xun * 10 + 10, 12)], ZHI[mod(xun * 10 + 11, 12)]];
    steps.xun = { xunName, xunYi, xunPalace, zhifuStar, zhishiDoor, kong: kongZhi };

    // ⑤ 天盘：值符随时干，九星沿环整体转动
    const hourGanCh = GAN[P.hourIdx % 10];
    const leadStem = hourGanCh === '甲' ? xunYi : hourGanCh;
    let target = stemPalace(leadStem);
    const targetRaw = target;
    if (target === 5) target = 2;
    const startP = xunPalace === 5 ? 2 : xunPalace;
    const shift = mod(ringIdx(target) - ringIdx(startP), 8);
    const tian = {}; // palace -> { stars:[], stems:[] }
    for (let k = 0; k < 8; k++) {
      const from = RING[k], to = RING[(k + shift) % 8];
      tian[to] = { stars: [STAR_HOME[from]], stems: [di[from]], from };
      if (from === 2) { tian[to].stars.push('天禽'); if (di[5] !== di[2]) tian[to].stems.push(di[5]); }
    }
    steps.tian = { hourGan: hourGanCh, leadStem, target, targetRaw, startP, shift };

    // ⑥ 人盘：值使从旬首宫按时辰数飞宫，八门沿环转动
    const stepsN = mod(P.hourIdx % 12 - (xun * 10) % 12, 12);
    const path = [xunPalace];
    for (let i = 1; i <= stepsN; i++) path.push(yang ? mod(xunPalace - 1 + i, 9) + 1 : mod(xunPalace - 1 - i, 9) + 1);
    let doorTarget = path[path.length - 1];
    const doorTargetRaw = doorTarget;
    if (doorTarget === 5) doorTarget = 2;
    const doorStart = xunPalace === 5 ? 2 : xunPalace;
    const doorShift = mod(ringIdx(doorTarget) - ringIdx(doorStart), 8);
    const door = {};
    for (let k = 0; k < 8; k++) door[RING[(k + doorShift) % 8]] = DOOR_HOME[RING[k]];
    steps.door = { path, stepsN, doorTarget, doorTargetRaw, doorStart, doorShift };

    // ⑦ 神盘：值符（神）随值符星落宫，阳顺阴逆
    const god = {};
    const gi = ringIdx(target);
    for (let k = 0; k < 8; k++) god[RING[mod(gi + (yang ? k : -k), 8)]] = GODS[k];
    steps.god = { start: target, clockwise: yang };

    // ⑧ 空亡、驿马、格局
    const hourZhiCh = ZHI[P.hourIdx % 12];
    const maZhi = { 申: '寅', 子: '寅', 辰: '寅', 寅: '申', 午: '申', 戌: '申', 巳: '亥', 酉: '亥', 丑: '亥', 亥: '巳', 卯: '巳', 未: '巳' }[hourZhiCh];
    const kongPalaces = [...new Set(kongZhi.map((z) => ZHI_PALACE[z]))];
    const maPalace = ZHI_PALACE[maZhi];

    const palaces = {};
    for (let p = 1; p <= 9; p++) {
      palaces[p] = {
        num: p, ...PALACE[p], di: di[p],
        tianStems: p === 5 ? [] : tian[p].stems, stars: p === 5 ? [] : tian[p].stars,
        door: door[p] || '', god: god[p] || '',
        kong: kongPalaces.includes(p), ma: p === maPalace, notes: [],
      };
    }

    const patterns = [];
    const add = (p, name, kind, why) => { patterns.push({ palace: p, name, kind, why }); if (p) palaces[p].notes.push(name); };
    if (shift === 0) add(0, '星伏吟', '凶', '九星都在本宫未动');
    if (shift === 4) add(0, '星反吟', '凶', '九星落在本宫的对冲宫');
    if (doorShift === 0) add(0, '门伏吟', '凶', '八门都在本宫未动');
    if (doorShift === 4) add(0, '门反吟', '凶', '八门落在本宫的对冲宫');
    const XING = { 戊: 3, 己: 2, 庚: 8, 辛: 9, 壬: 4, 癸: 4 };
    const MU = { 乙: 2, 丙: 6, 丁: 6, 戊: 6, 己: 6, 庚: 8, 辛: 8, 壬: 4, 癸: 4 };
    for (let p = 1; p <= 9; p++) {
      if (p === 5) continue;
      const P_ = palaces[p];
      for (const s of P_.tianStems) {
        if (XING[s] === p) add(p, `六仪击刑（${s}）`, '凶', `天盘${s}落${P_.gua}${p}宫，与宫支相刑`);
        if (MU[s] === p) add(p, `${'乙丙丁'.includes(s) ? '奇' : '仪'}入墓（${s}）`, '凶', `天盘${s}落${P_.gua}${p}宫，为其五行墓库`);
        if (s === '戊' && P_.di === '丙') add(p, '青龙返首', '吉', '天盘戊加地盘丙');
        if (s === '丙' && P_.di === '戊') add(p, '飞鸟跌穴', '吉', '天盘丙加地盘戊');
        if (s === '乙' && P_.di === '辛') add(p, '青龙逃走', '凶', '天盘乙加地盘辛');
        if (s === '辛' && P_.di === '乙') add(p, '白虎猖狂', '凶', '天盘辛加地盘乙');
        if (s === '丁' && P_.di === '癸') add(p, '朱雀投江', '凶', '天盘丁加地盘癸');
        if (s === '癸' && P_.di === '丁') add(p, '螣蛇夭矫', '凶', '天盘癸加地盘丁');
        if (s === '庚' && P_.di === '丙') add(p, '太白入荧', '凶', '天盘庚加地盘丙');
        if (s === '丙' && P_.di === '庚') add(p, '荧入太白', '凶', '天盘丙加地盘庚');
      }
      if (P_.door) {
        const dw = DOOR_WX[P_.door];
        if (KE[dw] === P_.wx) add(p, `门迫（${P_.door}）`, '凶', `${P_.door}属${dw}，克${P_.gua}宫${P_.wx}`);
        if (KE[P_.wx] === dw) add(p, `门受制（${P_.door}）`, '平', `${P_.gua}宫${P_.wx}克${P_.door}${dw}`);
      }
      if (P_.door === DOOR_HOME[p] && doorShift !== 0) add(p, `${P_.door}伏吟`, '平', '此门回到本宫');
    }

    return {
      input: { y, m, d, h, mi, text: `${y}-${pad(m)}-${pad(d)} ${pad(h)}:${pad(mi)}` },
      steps, palaces, patterns,
      summary: {
        zhifuStar, zhishiDoor, zhifuPalace: target, zhishiPalace: doorTarget,
        ma: maZhi, maPalace, kong: kongZhi, kongPalaces,
      },
    };
  }

  // ───────────────────────── 生成给 AI 的文字 ─────────────────────────
  const ORDER_TEXT = [4, 9, 2, 3, 5, 7, 8, 1, 6];
  function toText(c, question) {
    const S = c.steps, sm = c.summary;
    const L = [];
    L.push('【奇门遁甲排盘】时家奇门 · 转盘 · 拆补法 · 中五寄坤二');
    L.push(`起局时间：${c.input.text}（北京时间，未做真太阳时校正）`);
    L.push(`四柱：${S.pillars.year}年 ${S.pillars.month}月 ${S.pillars.day}日 ${S.pillars.hour}时`);
    L.push(`节气：${S.pillars.term}（交节 ${S.pillars.termTime}），下一节气 ${S.pillars.nextTerm}（${S.pillars.nextTermTime}）`);
    L.push(`定局：${S.ju.dun}${'〇一二三四五六七八九'[S.ju.ju]}局，${S.ju.yuan}（符头 ${S.ju.futou}）`);
    L.push(`旬首：${S.xun.xunName}（遁于${S.xun.xunYi}），旬空：${sm.kong.join('')}（落${sm.kongPalaces.map((p) => PALACE[p].gua + p + '宫').join('、')}）`);
    L.push(`值符：${sm.zhifuStar}，加时干${S.tian.hourGan === '甲' ? '（甲时用' + S.tian.leadStem + '）' : S.tian.hourGan}落${PALACE[sm.zhifuPalace].gua}${sm.zhifuPalace}宫`);
    L.push(`值使：${sm.zhishiDoor}，行${S.door.stepsN}步落${PALACE[sm.zhishiPalace].gua}${sm.zhishiPalace}宫`);
    L.push(`驿马：${sm.ma}（${PALACE[sm.maPalace].gua}${sm.maPalace}宫）`);
    L.push('');
    L.push('九宫盘面（按 上南下北、左东右西 的洛书方位，自左上至右下）：');
    for (const p of ORDER_TEXT) {
      const q = c.palaces[p];
      if (p === 5) { L.push(`- 中五宫（土）：地盘 ${q.di}（寄坤二宫）`); continue; }
      const marks = [q.kong && '旬空', q.ma && '驿马'].filter(Boolean);
      L.push(`- ${q.gua}${p}宫（${q.dir}，${q.wx}）：八神 ${q.god}｜九星 ${q.stars.join('+')}｜天盘 ${q.tianStems.join('')}｜八门 ${q.door}｜地盘 ${q.di}${marks.length ? '｜' + marks.join('、') : ''}`);
    }
    L.push('');
    if (c.patterns.length) {
      L.push('格局提示（程序按规则识别，仅供参考）：');
      for (const pt of c.patterns) L.push(`- ${pt.name}【${pt.kind}】${pt.palace ? PALACE[pt.palace].gua + pt.palace + '宫：' : '全局：'}${pt.why}`);
    } else L.push('格局提示：未识别到常见特殊格局。');
    L.push('');
    L.push('请你作为熟悉奇门遁甲的解读者，基于以上盘面：');
    L.push('1. 先确定用神（按所问之事选取，如求财看生门与戊、谋事看值符与时干、出行看开门等），说明用神落宫的星、门、神、奇仪及旺衰；');
    L.push('2. 分析用神宫与日干、时干所落宫的生克关系；');
    L.push('3. 结合格局、旬空、驿马给出判断，再给出具体可行的建议与应期参考；');
    L.push('4. 说明这些结论的不确定性。');
    L.push(`所问之事：${question && question.trim() ? question.trim() : '（未填写，请先给出整体时运解读）'}`);
    return L.join('\n');
  }

  return {
    GAN, ZHI, JIEQI, PALACE, RING, STAR_HOME, DOOR_HOME, GODS, GAN_WX,
    chart, toText, sunApparentLon, solveTerm, jdFromBeijing, beijingFromJd, fmtDT, deltaT,
  };
});

</script>
<script>
(function () {
  'use strict';
  const QM = window.QM;
  const $ = (id) => document.getElementById(id);
  const RING = QM.RING;
  const POS = { 4: [0, 0], 9: [1, 0], 2: [2, 0], 3: [0, 1], 5: [1, 1], 7: [2, 1], 8: [0, 2], 1: [1, 2], 6: [2, 2] };
  const SLOT = { god: [.2, .17], tian: [.8, .17], tian2: [.6, .17], star: [.5, .43], qin: [.5, .62], door: [.22, .8], di: [.8, .8], badge: [.5, .17], badge2: [.5, .3], diCenter: [.5, .5] };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const STAGES = ['四柱节气', '阴阳定局', '布地盘', '旬首值符', '转天盘', '转人盘', '排八神', '空马格局'];
  
  let C = null, stage = -1, timers = [], runToken = 0, question = '';
  const chips = {};

  // ── 起局页的八卦环 ──
  (function drawBagua() {
    const names = ['离', '坤', '兑', '乾', '坎', '艮', '震', '巽'];
    const syms = ['☲', '☷', '☱', '☰', '☵', '☶', '☳', '☴'];
    let h = '<circle r="94" stroke-width=".4"/><circle r="70" stroke-width=".4"/>';
    names.forEach((n, i) => {
      const a = (i * 45 - 90) * Math.PI / 180;
      h += `<text x="${(Math.cos(a) * 82).toFixed(2)}" y="${(Math.sin(a) * 82 + 4).toFixed(2)}" text-anchor="middle" font-size="12">${syms[i]}</text>`;
      h += `<text x="${(Math.cos(a) * 61).toFixed(2)}" y="${(Math.sin(a) * 61 + 3).toFixed(2)}" text-anchor="middle" font-size="7">${n}</text>`;
    });
    $('bagua').innerHTML = h;
  })();

  // ── 盘格 ──
  const grid = $('grid');
  for (const p of [4, 9, 2, 3, 5, 7, 8, 1, 6]) {
    const d = document.createElement('div');
    d.className = 'cell'; d.id = 'cell' + p;
    const info = QM.PALACE[p];
    d.innerHTML = `<div class="gua">${info.gua}</div><div class="pname">${p === 5 ? '中五宫' : info.gua + p + ' · ' + info.dir}</div>`;
    grid.appendChild(d);
  }
  const cellsAll = () => [...grid.children];

  function xy(p, slot) { const [c, r] = POS[p]; const [sx, sy] = SLOT[slot]; return [(c + sx) / 3 * 100, (r + sy) / 3 * 100]; }
  function mkChip(key, cls, text) {
    const el = document.createElement('div');
    el.className = 'chip off ' + cls; el.textContent = text;
    $('chips').appendChild(el); chips[key] = el; return el;
  }
  function place(el, p, slot, show = true) { const [x, y] = xy(p, slot); el.style.left = x + '%'; el.style.top = y + '%'; el.classList.toggle('off', !show); }
  const later = (ms, fn) => timers.push(setTimeout(fn, reduce ? 20 : ms));
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function setMove(ms) { document.documentElement.style.setProperty('--mv', (reduce ? 0 : ms / 1000) + 's'); }

  function build() {
    $('chips').innerHTML = ''; for (const k in chips) delete chips[k];
    for (let p = 1; p <= 9; p++) mkChip('di' + p, 'di', C.palaces[p].di);
    for (const p of RING) {
      mkChip('star' + p, 'star', QM.STAR_HOME[p].slice(1));
      mkChip('tian' + p, 'tian', C.palaces[p].di); // 天盘干 = 原宫地盘干，随星转
      mkChip('door' + p, 'door', QM.DOOR_HOME[p]);
    }
    mkChip('qin', 'qin', '禽'); chips.star5 = chips.qin;
    mkChip('tian5', 'tian', C.palaces[5].di);
    QM.GODS.forEach((g, i) => mkChip('god' + i, 'god', g));
    mkChip('stamp', 'stamp', cn(C.steps.ju.ju) + '局');
    mkChip('kong', 'badge', '空'); mkChip('kong2', 'badge', '空'); mkChip('ma', 'badge ma', '马');
    for (let p = 1; p <= 9; p++) place(chips['di' + p], p, p === 5 ? 'diCenter' : 'di', false);
    for (const p of RING) { place(chips['star' + p], p, 'star', false); place(chips['tian' + p], p, 'tian', false); place(chips['door' + p], p, 'door', false); }
    place(chips.qin, 5, 'star', false); place(chips.tian5, 5, 'tian', false);
    QM.GODS.forEach((g, i) => place(chips['god' + i], C.steps.god.start, 'god', false));
    place(chips.kong, 1, 'badge', false); place(chips.kong2, 1, 'badge', false); place(chips.ma, 1, 'badge2', false);
    place(chips.stamp, C.steps.ju.ju, 'star', false);
  }

  const ringAt = (home, s) => RING[((RING.indexOf(home) + s) % 8 + 8) % 8];
    function setStars(s, show) {
    for (const p of RING) { const to = ringAt(p, s); place(chips['star' + p], to, 'star', show); place(chips['tian' + p], to, 'tian', show); }
    const qTo = ringAt(2, s); place(chips.qin, qTo, 'qin', show); place(chips.tian5, qTo, 'tian2', show);
  }
  function setDoors(s, show) { for (const p of RING) place(chips['door' + p], ringAt(p, s), 'door', show); }
  function setGods(show, count = 8) {
    const S = C.steps.god; const gi = RING.indexOf(S.start);
    QM.GODS.forEach((g, i) => {
      const p = RING[((gi + (S.clockwise ? i : -i)) % 8 + 8) % 8];
      place(chips['god' + i], show && i < count ? p : S.start, 'god', show && i < count);
    });
  }
  function clearMarks() {
    $('board').classList.remove('dial', 'done');
    cellsAll().forEach((c) => c.classList.remove('hl', 'hot', 'pulse'));
    Object.values(chips).forEach((c) => c.classList.remove('key'));
    $('paths').innerHTML = '';
  }
  const hl = (p, cls = 'hl') => $('cell' + p).classList.add(cls);

  // 第 k 幕完成后的静态盘面
  function staticState(k) {
    clearMarks();
    const S = C.steps;
    for (let p = 1; p <= 9; p++) place(chips['di' + p], p, p === 5 ? 'diCenter' : 'di', k >= 2);
    if (k === 3) { setStars(0, true); place(chips.qin, 5, 'star', true); for (const p of RING) chips['tian' + p].classList.add('off'); chips.tian5.classList.add('off'); }
    else setStars(k >= 4 ? S.tian.shift : 0, k >= 4);
    setDoors(k >= 5 ? S.door.doorShift : 0, k >= 3);
    setGods(k >= 6);
    const kp = C.summary.kongPalaces;
    place(chips.kong, kp[0], 'badge', k >= 7);
    place(chips.kong2, kp[1] || kp[0], 'badge', k >= 7 && kp.length > 1);
    place(chips.ma, C.summary.maPalace, 'badge2', k >= 7);
    place(chips.stamp, S.ju.ju, 'star', k === 1);
    if (k === 0) drawDial(C.steps.pillars.sunLon);
    if (k === 1) hl(S.ju.ju);
    if (k === 7) $('board').classList.add('done');
    $('board').classList.toggle('filled', k >= 3);
    if (k === 3) { const xp = S.xun.xunPalace; hl(xp); chips['star' + xp].classList.add('key'); chips['door' + (xp === 5 ? 2 : xp)].classList.add('key'); }
    if (k === 4) hl(S.tian.target);
    if (k === 5) hl(S.door.doorTarget);
    if (k === 6) hl(S.god.start);
    if (k === 7) C.patterns.forEach((pt) => pt.palace && hl(pt.palace, 'hot'));
  }

  // 黄道盘：上南下北、左东右西，春分在东（左），夏至在南（上）
  const JQ_ALL = QM.JIEQI;
  const dialPt = (lon, r) => { const a = lon * Math.PI / 180; return [150 - r * Math.cos(a), 150 - r * Math.sin(a)]; };
  function drawDial(lon, from) {
    $('board').classList.add('dial');
    let h = '<g class="dialg"><circle class="ring" cx="150" cy="150" r="118"/>';
    for (let i = 0; i < 24; i++) {
      const L = i * 15, [x1, y1] = dialPt(L, 112), [x2, y2] = dialPt(L, 124), [tx, ty] = dialPt(L, 136);
      h += `<line class="tick" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
      h += `<text x="${tx.toFixed(1)}" y="${(ty + 2.5).toFixed(1)}" text-anchor="middle">${JQ_ALL[i]}</text>`;
    }
    const start = from == null ? lon : from;
    const sweep = ((lon - start) % 360 + 360) % 360;
    if (sweep > 0.5) {
      const [ax, ay] = dialPt(start, 118), [bx, by] = dialPt(lon, 118);
      h += `<path class="arc" d="M${ax.toFixed(1)},${ay.toFixed(1)} A118,118 0 ${sweep > 180 ? 1 : 0} 0 ${bx.toFixed(1)},${by.toFixed(1)}"/>`;
    }
    const [sx, sy] = dialPt(lon, 118);
    h += `<circle class="sunglow" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="11"/><circle class="sun" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="6"/>`;
    h += `<text class="now" x="150" y="146" text-anchor="middle">${C.steps.pillars.term}</text>`;
    h += `<text x="150" y="160" text-anchor="middle">太阳黄经 ${lon.toFixed(1)}°</text></g>`;
    $('paths').innerHTML = h;
  }

  const center = (p) => { const [c, r] = POS[p]; return [c * 100 + 50, r * 100 + 50]; };
  function drawPath(list, upto, labels) {
    const pts = list.slice(0, upto + 1).map(center);
    let h = `<polyline points="${pts.map((q) => q.join(',')).join(' ')}"/>`;
    pts.forEach((q, i) => {
      h += `<circle cx="${q[0]}" cy="${q[1]}" r="${i === upto ? 4 : 2.5}"/>`;
      if (labels) h += `<text x="${q[0] + 6}" y="${q[1] - 6}">${labels[i]}</text>`;
    });
    $('paths').innerHTML = h;
  }

  // 各幕动画：从上一幕的静态盘面出发，完成后调用 done
  function animate(k, done) {
    const S = C.steps;
    if (k === 0) {
      const lon = S.pillars.sunLon, from = lon - 105, N = 30;
      for (let i = 0; i <= N; i++) later(60 * i, () => drawDial(from + (lon - from) * (1 - Math.pow(1 - i / N, 3)), from));
      later(60 * N + 1400, done); return;
    }
    if (k === 1) {
      $('paths').innerHTML = ''; $('board').classList.remove('dial');
      later(400, () => { hl(S.ju.ju); $('cell' + S.ju.ju).classList.add('pulse'); });
      later(900, () => place(chips.stamp, S.ju.ju, 'star', true));
      later(2400, done); return;
    }
    if (k === 2) {
      const order = S.di.order;
      order.forEach((o, i) => later(450 * i + 300, () => {
        place(chips['di' + o.palace], o.palace, o.palace === 5 ? 'diCenter' : 'di', true);
        cellsAll().forEach((c) => c.classList.remove('hl')); hl(o.palace);
        drawPath(order.map((x) => x.palace), i);
      }));
      later(450 * order.length + 700, done); return;
    }
    if (k === 3) {
      $('board').classList.add('filled');
      setStars(0, true); place(chips.qin, 5, 'star', true); for (const p of RING) chips['tian' + p].classList.add('off'); chips.tian5.classList.add('off');
      setDoors(0, true);
      later(700, () => { hl(S.xun.xunPalace); $('cell' + S.xun.xunPalace).classList.add('pulse'); });
      later(1400, () => { const xp = S.xun.xunPalace; chips['star' + xp].classList.add('key'); chips['door' + (xp === 5 ? 2 : xp)].classList.add('key'); });
      later(2000, done); return;
    }
    if (k === 4) {
      // 天盘干从地盘干处浮起；天禽先寄坤二；然后整盘顺时针转
      setMove(0);
      for (const p of RING) place(chips['tian' + p], p, 'di', true);
      place(chips.tian5, 5, 'diCenter', true); place(chips.qin, 5, 'star', true);
      void $('chips').offsetWidth; setMove(500);
      later(200, () => { for (const p of RING) place(chips['tian' + p], p, 'tian', true); });
      later(900, () => { hl(2); place(chips.qin, 2, 'qin', true); place(chips.tian5, 2, 'tian2', true); });
      later(1900, () => { cellsAll().forEach((c) => c.classList.remove('hl')); hl(S.tian.target); $('cell' + S.tian.target).classList.add('pulse'); setMove(330); });
      const n = S.tian.shift;
      for (let i = 1; i <= n; i++) later(2300 + 360 * i, () => setStars(i, true));
      later(2300 + 360 * n + 600, done); return;
    }
    if (k === 5) {
      const path = S.door.path;
      const zi = QM.ZHI.indexOf(S.xun.xunName[1]);
      const labels = path.map((_, i) => QM.ZHI[(zi + i) % 12]);
      path.forEach((_, i) => later(480 * i + 300, () => { drawPath(path, i, labels); cellsAll().forEach((c) => c.classList.remove('hl')); hl(path[i]); }));
      const t0 = 480 * path.length + 500;
      const n = S.door.doorShift;
      later(t0 - 100, () => { cellsAll().forEach((c) => c.classList.remove('hl')); hl(S.door.doorTarget); });
      setMove(330);
      for (let i = 1; i <= n; i++) later(t0 + 360 * i, () => setDoors(i, true));
      later(t0 + 360 * n + 600, done); return;
    }
    if (k === 6) {
      hl(S.god.start);
      for (let i = 1; i <= 8; i++) later(300 * i, () => setGods(true, i));
      later(300 * 9 + 400, done); return;
    }
    if (k === 7) {
      const kp = C.summary.kongPalaces;
      later(300, () => place(chips.kong, kp[0], 'badge', true));
      later(600, () => kp[1] && place(chips.kong2, kp[1], 'badge', true));
      later(900, () => place(chips.ma, C.summary.maPalace, 'badge2', true));
      C.patterns.filter((p) => p.palace).forEach((pt, i) => later(1200 + 280 * i, () => hl(pt.palace, 'hot')));
      later(1500 + 280 * C.patterns.length, done); return;
    }
  }

  // ── 旁白 ──
  const P = (p) => `${QM.PALACE[p].gua}${p}宫`;
  const cn = (n) => '〇一二三四五六七八九'[n];
  function explain(k) {
    const S = C.steps, sm = C.summary;
    const h = (no, t) => `<h2><span class="no">${no + 1}/8</span>${t}</h2>`;
    let html = '';
    if (k === -1) html = `<h2>起局</h2><p>${C.input.text}${question ? '，问：' + esc(question) : ''}</p><p class="rule">九宫已列，静候排盘。</p>`;
    if (k === 0) html = h(0, '四柱与节气') + `
      <div class="kv"><div><span>年柱</span><b>${S.pillars.year}</b></div><div><span>月柱</span><b>${S.pillars.month}</b></div><div><span>日柱</span><b>${S.pillars.day}</b></div><div><span>时柱</span><b>${S.pillars.hour}</b></div></div>
      <p>太阳视黄经 <span class="mono">${S.pillars.sunLon.toFixed(3)}°</span>，正处在<b>${S.pillars.term}</b>（<span class="mono">${S.pillars.termTime}</span> 交节），下一个节气是${S.pillars.nextTerm}（<span class="mono">${S.pillars.nextTermTime}</span>）。</p>
      <p class="rule">年柱以立春换，月柱以“节”换（每 30° 黄经一个月），日柱由儒略日数对 60 取余，${S.pillars.dayShift ? '本时刻在 23 点后，日柱已算作次日，' : ''}时柱用五鼠遁从日干推出。</p>`;
    if (k === 1) html = h(1, '阴阳遁与局数') + `
      <p>${S.pillars.term}在${S.ju.yang ? '冬至之后、夏至之前，用<b>阳遁</b>' : '夏至之后、冬至之前，用<b>阴遁</b>'}。</p>
      <p>拆补法定三元：日柱 ${S.pillars.day} 往前 ${S.ju.back} 天到最近的甲/己日，符头为 <b>${S.ju.futou}</b>，地支“${S.ju.futou[1]}”属${{ 上元: '子午卯酉', 中元: '寅申巳亥', 下元: '辰戌丑未' }[S.ju.yuan]}，所以是<b>${S.ju.yuan}</b>。</p>
      <div class="yuan">${['上元', '中元', '下元'].map((y, i) => `<span class="${y === S.ju.yuan ? 'on' : ''}">${y} ${S.ju.tableRow[i]}局</span>`).join('')}</div>
      <p>查${S.pillars.term}一行得 <b>${S.ju.dun}${cn(S.ju.ju)}局</b>，地盘从${P(S.ju.ju)}起。</p>`;
    if (k === 2) html = h(2, '布地盘三奇六仪') + `
      <p>按“戊己庚辛壬癸丁丙乙”的顺序，从${P(S.ju.ju)}放第一个“戊”，${S.ju.yang ? '阳遁按宫数 1→9 顺飞' : '阴遁按宫数 9→1 逆飞'}，九个干填满九宫。</p>
      <p class="mono">${S.di.order.map((o) => o.palace + o.stem).join(' → ')}</p>
      <p class="rule">六仪是六个旬首“甲”的藏身之处：甲子戊、甲戌己、甲申庚、甲午辛、甲辰壬、甲寅癸。乙丙丁是三奇。</p>`;
    if (k === 3) html = h(3, '旬首、值符、值使') + `
      <p>时柱 ${S.pillars.hour} 在 <b>${S.xun.xunName}</b> 旬，甲遁于六仪“${S.xun.xunYi}”。地盘上“${S.xun.xunYi}”在${P(S.xun.xunPalace)}。</p>
      <p>该宫原本的星是<b>值符 · ${S.xun.zhifuStar}</b>，原本的门是<b>值使 · ${S.xun.zhishiDoor}</b>（加下划线的两个）。${S.xun.xunPalace === 5 ? '旬首落中五宫，值符取天禽，值使取寄宫坤二的死门。' : ''}</p>
      <p class="rule">此刻九星、八门都在本宫：蓬1 芮2 冲3 辅4 禽5 心6 柱7 任8 英9；休1 死2 伤3 杜4 开6 惊7 生8 景9。</p>`;
    if (k === 4) html = h(4, '转天盘') + `
      <p>时干是“${S.tian.hourGan}”${S.tian.hourGan === '甲' ? `，甲不入盘，用旬首六仪“${S.tian.leadStem}”代替` : ''}，它在地盘${P(S.tian.targetRaw)}${S.tian.targetRaw === 5 ? '，中五寄坤二' : ''}。值符${S.xun.zhifuStar}随之转到<b>${P(S.tian.target)}</b>。</p>
      <p>九星沿外圈顺时针整体转动 <b>${S.tian.shift}</b> 格，每颗星带着原宫的地盘干同行，这就是天盘干。天禽随天芮。</p>
      ${S.tian.shift === 0 ? '<p><b>九星未动，是伏吟盘。</b></p>' : S.tian.shift === 4 ? '<p><b>九星转到对宫，是反吟盘。</b></p>' : ''}`;
    if (k === 5) html = h(5, '转人盘') + `
      <p>值使${S.xun.zhishiDoor}从${P(S.xun.xunPalace)}出发，由旬首地支“${S.xun.xunName[1]}”数到时支“${S.pillars.hour[1]}”共 <b>${S.door.stepsN}</b> 步，${S.ju.yang ? '阳遁顺' : '阴遁逆'}宫而行：</p>
      <p class="mono">${S.door.path.join(' → ')}${S.door.doorTargetRaw === 5 ? '（中五寄坤二）' : ''}</p>
      <p>值使落<b>${P(S.door.doorTarget)}</b>，其余七门随之转动。</p>`;
    if (k === 6) html = h(6, '排八神') + `
      <p>八神之首“值符”跟随值符星落${P(S.god.start)}，然后${S.god.clockwise ? '阳遁顺时针' : '阴遁逆时针'}依次排：值符、腾蛇、太阴、六合、白虎、玄武、九地、九天。</p>`;
    if (k === 7) html = h(7, '空亡、驿马与格局') + `
      <p>旬空 ${sm.kong.join('、')}，落${sm.kongPalaces.map(P).join('、')}；驿马在${sm.ma}，落${P(sm.maPalace)}。</p>
      ${C.patterns.length ? `<ul class="pat">${C.patterns.map((pt) => `<li><span class="tag ${pt.kind}">${pt.kind}</span><span><b>${pt.name}</b> ${pt.palace ? P(pt.palace) + '：' : ''}${pt.why}</span></li>`).join('')}</ul>` : '<p>未识别到常见特殊格局。</p>'}`;
    $('explain').innerHTML = html;
  }

  function caption(k) {
    const S = C.steps, sm = C.summary;
    const step = k >= 0 ? `<span class="step">${k + 1} / 8 · ${STAGES[k]}</span>` : '<span class="step">起局</span>';
    const t = [
      `四柱 <b>${S.pillars.year} ${S.pillars.month} ${S.pillars.day} ${S.pillars.hour}</b>，太阳行至${S.pillars.term}`,
      `${S.pillars.term}属${S.ju.dun.slice(0, 1)}遁，符头${S.ju.futou}为${S.ju.yuan}，得 <b>${S.ju.dun}${cn(S.ju.ju)}局</b>`,
      `三奇六仪自${P(S.ju.ju)}起，${S.ju.yang ? '顺' : '逆'}布九宫`,
      `时在${S.xun.xunName}旬，甲遁于${S.xun.xunYi}：值符 <b>${S.xun.zhifuStar}</b>，值使 <b>${S.xun.zhishiDoor}</b>`,
      `天盘干浮起，天禽寄坤；值符随时干${S.tian.hourGan === '甲' ? S.tian.leadStem : S.tian.hourGan}转至 <b>${P(S.tian.target)}</b>`,
      `值使${S.xun.zhishiDoor}行 ${S.door.stepsN} 步，落 <b>${P(S.door.doorTarget)}</b>，八门随转`,
      `八神随值符，自${P(S.god.start)}${S.god.clockwise ? '顺' : '逆'}排八宫`,
      `旬空${sm.kong.join('')}，驿马在${sm.ma}${C.patterns.length ? `，见${C.patterns.length}处格局` : ''}`,
    ];
    $('caption').innerHTML = step + `<span>${k >= 0 ? t[k] : esc(C.input.text) + (question ? '　问：' + esc(question) : '')}</span>`;
  }

  function showMeta(k) {
    const S = C.steps; const parts = [];
    if (k >= 0) parts.push(`<span><b>${S.pillars.year} ${S.pillars.month} ${S.pillars.day} ${S.pillars.hour}</b></span>`);
    if (k >= 1) parts.push(`<span>${S.pillars.term} · <b>${S.ju.dun}${cn(S.ju.ju)}局</b> ${S.ju.yuan}</span>`);
    if (k >= 3) parts.push(`<span>值符 <b>${S.xun.zhifuStar}</b> · 值使 <b>${S.xun.zhishiDoor}</b></span>`);
    $('meta').innerHTML = parts.join('');
  }
  function showProgress(k) { [...$('progress').children].forEach((s, i) => s.classList.toggle('on', i <= k)); }

  // ── 阶段控制 ──
  STAGES.forEach(() => $('progress').appendChild(document.createElement('span')));
  STAGES.forEach((name, i) => {
    const li = document.createElement('li'); const b = document.createElement('button');
    b.type = 'button'; b.textContent = `${i + 1} ${name}`;
    b.addEventListener('click', () => playStage(i));
    li.appendChild(b); $('stages').appendChild(li);
  });
  function markStages() { [...$('stages').querySelectorAll('button')].forEach((b, i) => (i === stage ? b.setAttribute('aria-current', 'step') : b.removeAttribute('aria-current'))); }
  function jump(k) {
    clearTimers(); setMove(0);
    stage = k; staticState(k); explain(k); caption(k); showMeta(k); showProgress(k); markStages();
    requestAnimationFrame(() => setMove(380));
  }
  function playStage(k) {
    return new Promise((res) => {
      clearTimers(); setMove(0); staticState(k - 1);
      stage = k; explain(k); caption(k); showMeta(k); showProgress(k); markStages();
      requestAnimationFrame(() => { setMove(380); animate(k, res); });
    });
  }
  const wait = (ms) => new Promise((r) => later(ms, r));

  // ── 三幕切换 ──
  function setPhase(ph) {
    $('intro').hidden = ph !== 'intro';
    $('theater').hidden = ph === 'intro';
    $('brand').hidden = ph === 'intro';
    $('skip').hidden = ph !== 'ritual';
    $('tabs').hidden = ph !== 'result';
    $('progress').hidden = ph !== 'ritual';
    $('stages').hidden = ph !== 'result';
    $('againRow').hidden = ph !== 'result';
    $('caption').hidden = ph !== 'ritual';
    $('theater').classList.toggle('solo', ph === 'ritual');
    if (ph !== 'ritual') $('seal').classList.add('off');
    if (ph === 'ritual') showTab('process');
    window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
  }
  function showTab(t) {
    for (const b of $('tabs').querySelectorAll('button')) b.setAttribute('aria-selected', String(b.dataset.tab === t));
    $('pane-process').hidden = t !== 'process';
    $('pane-raw').hidden = t !== 'raw';
  }
  $('tabs').addEventListener('click', (e) => {
    const t = e.target.closest('button')?.dataset.tab; if (!t) return;
    showTab(t);
    if (t === 'process') jump(7);
    else { jump(7); }
  });

  async function ritual() {
    const my = ++runToken;
    setPhase('ritual');
    $('theater').classList.remove('fade-in'); void $('theater').offsetWidth; $('theater').classList.add('fade-in');
    jump(-1);
    await wait(500); if (my !== runToken) return;
    for (let k = 0; k < STAGES.length; k++) {
      await playStage(k); if (my !== runToken) return;
    }
    $('seal').classList.remove('off');
    await wait(1800); if (my !== runToken) return;
    finish();
  }
  function finish() {
    runToken++; clearTimers();
    jump(7);
    setPhase('result');
    showTab('raw');
  }
  $('skip').addEventListener('click', finish);
  $('again').addEventListener('click', () => { runToken++; clearTimers(); setPhase('intro'); $('dt').value = beijingNow(); });

  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  // ── 原文 ──
  $('copy').addEventListener('click', () => {
    const t = $('out').textContent;
    const ok = () => { $('copy').textContent = '已复制'; setTimeout(() => ($('copy').textContent = '复制文本'), 1600); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($('out')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $('copy').textContent = '已选中，按 Ctrl+C 复制'; };
    try { navigator.clipboard.writeText(t).then(ok, fallback); } catch (e) { fallback(); }
  });

  // ── 起局 ──
  const pad = (n) => String(n).padStart(2, '0');
  function beijingNow() {
    const d = new Date(Date.now() + 8 * 3600e3);
    return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}T${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;
  }
  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = $('dt').value; if (!v) return;
    const [ds, ts] = v.split('T'); const [y, m, d] = ds.split('-').map(Number); const [hh, mm] = ts.split(':').map(Number);
    question = $('q').value.trim();
    C = QM.chart(y, m, d, hh, mm);
    build();
    $('out').textContent = QM.toText(C, question);
    ritual();
  });
  $('dt').value = beijingNow();
})();
</script>
</body>
</html>
